<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A giant impact, simulated: two self-gravitating planets of real mass collide in WebGL — the splash, the debris disk, and the moon that gathers out of it.">
<meta property="og:title" content="Stardust — Impact">
<meta property="og:description" content="Two planets with real mass and gravity collide in your browser.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#x1F4A5;</text></svg>">
<title>Stardust — Impact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Same night as the main page — every color explicit. */
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #04060a;
    overflow: hidden;
  }
  #stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: grab;
  }
  #stage.dragging { cursor: grabbing; }
  .hud {
    position: fixed;
    z-index: 2;
    pointer-events: none;
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
    line-height: 1.7;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #66788c;
    user-select: none;
  }
  .hud strong {
    display: block;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 0.3em;
    color: #c2d4e6;
  }
  .hud button {
    background: none;
    border: none;
    margin: 0;
    -webkit-tap-highlight-color: transparent;
    padding: 0 0 3px;
    font: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    color: #66788c;
    cursor: pointer;
    border-bottom: 1px solid transparent;
  }
  .hud button:hover { color: #9db0c4; }
  .hud button:focus-visible { outline: 1px solid #66788c; outline-offset: 3px; }
  .hud button.on { color: #c2d4e6; border-bottom-color: #c2d4e6; }
  .hud button .ic {
    margin-right: 6px;
    font-size: 12px;
    filter: saturate(0.6) brightness(0.9);
  }
  .hud button.on .ic { filter: none; }
  #hud-title { top: 22px; left: 26px; }
  #hud-corner {
    top: 22px;
    right: 26px;
    z-index: 3;
    pointer-events: auto;
  }
  #hud-back {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 14px;
    color: #c2d4e6;
    text-decoration: none;
    background: rgba(8, 12, 18, 0.7);
    border: 1px solid #2a3644;
    border-radius: 4px;
  }
  #hud-back:hover { border-color: #66788c; color: #ffffff; background: rgba(16, 24, 34, 0.85); }
  #hud-controls {
    top: 96px;
    left: 26px;
    display: flex;
    flex-direction: column;
    gap: 13px;
    pointer-events: auto;
  }
  #hud-preset, #hud-run { display: flex; gap: 6px 16px; flex-wrap: wrap; align-items: baseline; }
  #hud-run .sep { color: #3d4a58; }
  #adv-panel {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding: 12px 14px;
    background: rgba(8, 12, 18, 0.78);
    border: 1px solid #22303e;
    border-radius: 4px;
  }
  #adv-panel[hidden] { display: none; }
  #adv-panel label {
    display: grid;
    grid-template-columns: 96px 120px 64px;
    align-items: center;
    gap: 10px;
    font-size: 10px;
    letter-spacing: 0.1em;
  }
  #adv-panel input[type="range"] {
    width: 120px;
    accent-color: #7f9cbb;
    cursor: pointer;
  }
  #adv-panel input[type="checkbox"] {
    justify-self: start;
    width: 14px;
    height: 14px;
    accent-color: #7f9cbb;
    cursor: pointer;
  }
  #adv-panel span { text-align: right; color: #9db0c4; font-variant-numeric: tabular-nums; }
  #adv-panel .note { margin-top: 4px; font-size: 9px; letter-spacing: 0.08em; color: #3d4a58; text-transform: none; }
  #hud-report {
    bottom: 64px;
    right: 26px;
    padding: 10px 12px;
    background: rgba(8, 12, 18, 0.78);
    border: 1px solid #22303e;
    border-radius: 4px;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: none;
    line-height: 1.6;
    color: #9db0c4;
    white-space: pre;
    font-variant-numeric: tabular-nums;
  }
  #hud-report[hidden] { display: none; }
  #hud-report b { font-weight: 500; color: #c2d4e6; }
  #hud-report i { font-style: normal; color: #566574; }
  #hud-help { bottom: 20px; left: 26px; }
  #hud-stat { bottom: 20px; right: 26px; text-align: right; font-variant-numeric: tabular-nums; }
  #hud-stat strong { font-size: 15px; letter-spacing: 0.2em; }
  #fallback {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px;
    letter-spacing: 0.1em;
    color: #8a97a6;
    background: #04060a;
    text-align: center;
    padding: 24px;
  }
  @media (max-width: 640px) {
    #hud-help { display: none; }
    #hud-title { top: 14px; left: 16px; }
    #hud-corner { top: 14px; right: 16px; }
    #hud-back { padding: 8px 10px; }
    #hud-controls { top: 78px; left: 16px; right: 16px; gap: 10px; }
    .hud { font-size: 12px; }
    .hud button { padding: 5px 0 6px; }
    #hud-preset, #hud-run { gap: 4px 14px; }
    #adv-panel { max-width: calc(100vw - 64px); }
    #adv-panel label { grid-template-columns: 84px 1fr 56px; }
    #adv-panel input[type="range"] { width: 100%; height: 26px; }
    #hud-stat { bottom: 12px; right: 16px; }
    #hud-report { bottom: 58px; right: 16px; }
  }
</style>

<body>
<canvas id="stage"></canvas>
<div class="hud" id="hud-title"><strong>Impact</strong><span id="hud-sub">initializing…</span></div>
<div class="hud" id="hud-corner"><a id="hud-back" href="index.html">← stardust</a></div>
<div class="hud" id="hud-controls">
<div id="hud-preset">
  <button data-preset="theia" class="on"><span class="ic">🌙</span>theia</button>
  <button data-preset="headon"><span class="ic">💥</span>head-on</button>
  <button data-preset="hitrun"><span class="ic">☄️</span>hit &amp; run</button>
  <button data-preset="twins"><span class="ic">🪐</span>twins</button>
  <button data-preset="shatter"><span class="ic">🔥</span>shatter</button>
</div>
<div id="hud-run">
  <button id="btn-pause">pause</button>
  <button id="btn-restart">restart</button>
  <span class="sep">·</span>
  <button data-speed="1">¼×</button>
  <button data-speed="2">½×</button>
  <button data-speed="4" class="on">1×</button>
  <button data-speed="8">2×</button>
  <button data-speed="16">4×</button>
  <span class="sep">·</span>
  <button id="btn-follow">follow</button>
</div>
<div id="hud-adv">
  <button id="adv-toggle"><span class="ic">⚙️</span>advanced</button>
  <div id="adv-panel" hidden>
    <label>impactor <input type="range" id="set-q" min="0.02" max="1" step="0.01" value="0.1"><span id="val-q">0.10 M⊕</span></label>
    <label>angle <input type="range" id="set-angle" min="0" max="85" step="1" value="45"><span id="val-angle">45°</span></label>
    <label>speed <input type="range" id="set-vfac" min="0.8" max="3" step="0.05" value="1.05"><span id="val-vfac">1.05 v.esc</span></label>
    <label>spin <input type="range" id="set-spin0" min="-0.55" max="0.55" step="0.01" value="0.18"><span id="val-spin0">7.8 h</span></label>
    <label>impactor spin <input type="range" id="set-spin1" min="-0.55" max="0.55" step="0.01" value="0.20"><span id="val-spin1">8.1 h</span></label>
    <label>bodies <input type="range" id="set-n" min="0" max="4" step="1" value="3"><span id="val-n">131k</span></label>
    <label>bounce <input type="range" id="set-rest" min="0.05" max="0.9" step="0.05" value="0.3"><span id="val-rest">0.30</span></label>
    <label>core <input type="range" id="set-core" min="0" max="45" step="1" value="32"><span id="val-core">32%</span></label>
    <label>density <input type="range" id="set-dens" min="0.5" max="1.2" step="0.05" value="0.75"><span id="val-dens">0.75 ρ⊕</span></label>
    <label>exposure <input type="range" id="set-exp" min="0.2" max="4" step="0.1" value="1"><span id="val-exp">1.0</span></label>
    <label>glow <input type="range" id="set-glow" min="0" max="3" step="0.1" value="1"><span id="val-glow">1.0</span></label>
    <label>shading <input type="checkbox" id="set-shade" checked><span id="val-shade">on</span></label>
    <label>stars <input type="checkbox" id="set-stars" checked><span id="val-stars">on</span></label>
    <div class="note">impactor · angle · speed · spin · bodies · bounce · core · density restart the run</div>
  </div>
</div>
</div>
<div class="hud" id="hud-report" hidden></div>
<div class="hud" id="hud-help">drag — rotate &nbsp;·&nbsp; wheel — zoom &nbsp;·&nbsp; space — pause &nbsp;·&nbsp; r — restart</div>
<div class="hud" id="hud-stat"><strong id="hud-clock">T+ 0h 00m</strong><span id="hud-fps"></span></div>
<div id="fallback">WebGL 2 is not available in this browser —<br>the simulation cannot run.</div>
<script>
(function () {
'use strict';
var $ = function (id) { return document.getElementById(id); };
var canvas = $('stage');
var gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, preserveDrawingBuffer: false, powerPreference: 'high-performance' });
function fail(msg) { var f = $('fallback'); f.innerHTML = msg; f.style.display = 'flex'; }
if (!gl) { fail('WebGL 2 is not available in this browser —<br>the simulation cannot run.'); return; }
if (!gl.getExtension('EXT_color_buffer_float')) { fail('This GPU cannot render to float textures —<br>the simulation cannot run.'); return; }

// ---------- units ----------
// G = 1, Earth mass = 1, Earth radius = 1. Then the time unit is √(R³/GM) = 805 s
// (13.4 min), the velocity unit is 7.91 km/s, and escape speed off Earth is √2.
// Every body-particle carries the same mass, so a body's mass is a head count
// and — at Earth density — its radius is the cube root of its mass.
var T_UNIT = 805, V_UNIT = 7.91;
var L_EM = 0.1163;                          // the Earth–Moon system's angular momentum today, 3.5e34 kg m²/s, in M⊕√(GM⊕R⊕)
var N_CHOICES = [16384, 32768, 65536, 131072, 262144];
var N_LABELS = ['16k', '33k', '65k', '131k', '262k'];
var SLOTS = 8;                              // body-particles a contact cell can hold
var FL = 6.0, FH = 2 * FL / 64;             // gravity mesh: 64³ cells over ±6 R⊕
var PP_CAP = 8192, PP_W = 128, PP_H = 64;   // the loose material the pairwise pass can take, as a 128×64 list
var PP_CUT = 5 * FH;                        // how far the pairwise correction reaches: five cells
var PRESETS = {
  theia:   { q: 0.10, angle: 45, vfac: 1.05, dist: 7.5, label: 'theia' },      // the canonical Moon-forming impact
  headon:  { q: 0.10, angle: 0,  vfac: 1.00, dist: 7.5, label: 'head-on' },
  hitrun:  { q: 0.25, angle: 65, vfac: 1.60, dist: 10,  label: 'hit & run' },  // grazing and fast: the impactor survives
  twins:   { q: 1.00, angle: 45, vfac: 1.10, dist: 9,   label: 'twins' },
  shatter: { q: 0.50, angle: 20, vfac: 2.60, dist: 18,  label: 'shatter' }
};
// both bodies arrive turning about the orbital axis, prograde, with days of
// about eight hours — a young planet's; the sliders take either to none, to
// retrograde, or up to a Ćuk & Stewart 2.6-hour Earth
var S = { q: 0.1, angle: 45, vfac: 1.05, spin0: 0.18, spin1: 0.20, nIdx: 3, rest: 0.3, core: 0.325, dens: 0.75,
          exposure: 1.0, glow: 1.0, shade: true, stars: true, follow: false, speed: 4, preset: 'theia' };
var COL_TARGET = [0.40, 0.58, 0.90], COL_IMPACTOR = [0.96, 0.55, 0.28];
var FOV = 38 * Math.PI / 180;

// ---------- shaders ----------
var GLSL_HASH = [
  'uint hash(uint x) { x ^= x >> 16u; x *= 0x7feb352du; x ^= x >> 15u; x *= 0x846ca68bu; x ^= x >> 16u; return x; }',
  'float rnd(uint x) { return float(hash(x)) * (1.0 / 4294967296.0); }'
].join('\n');
// molten rock: dark red, orange, then yellow-white
var GLSL_HEAT = [
  'vec3 heat(float t) {',
  '  t = max(t, 0.0);',
  '  float r = smoothstep(0.0, 0.25, t);',
  '  float g = smoothstep(0.15, 0.7, t) * 0.75;',
  '  float b = smoothstep(0.45, 1.3, t) * 0.65;',
  '  return vec3(r, g, b) * min(t * 2.5, 2.2);',
  '}'
].join('\n');
// what a body-particle is made of, from P.w = layer + 4·body: crust in the
// body's colour, mantle a deep red, core metal — Earth's silver, the
// impactor's gold, so its core can be followed down
var GLSL_MATCOL = [
  'vec3 matColor(float w, vec3 c0, vec3 c1) {',
  '  float body = step(3.5, w), layer = w - 4.0 * body;',
  '  vec3 crust = mix(c0, c1, body);',
  '  vec3 mantle = mix(vec3(0.60, 0.22, 0.17), vec3(0.58, 0.30, 0.14), body);',
  '  vec3 core = mix(vec3(0.86, 0.86, 0.82), vec3(0.88, 0.72, 0.42), body);',
  '  return layer > 1.5 ? crust : (layer > 0.5 ? mantle : core);',
  '}'
].join('\n');

var QUAD_VS = [
  '#version 300 es',
  'void main() {',
  '  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));',
  '  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);',
  '}'
].join('\n');

// ---------- the physics, in six passes a step ----------
// 3-D grids live in 2-D atlases: slices side by side. The gravity mesh is a
// fixed 64³ over ±6 R⊕ (8×8 slices of 64×64), its coarse twin 16³ (4×4 of 16²).
var GLSL_GRID = [
  'ivec2 fineAt(ivec3 c) { return ivec2((c.z & 7) * 64 + c.x, (c.z >> 3) * 64 + c.y); }',
  'ivec2 coarseAt(ivec3 c) { return ivec2((c.z & 3) * 16 + c.x, (c.z >> 2) * 16 + c.y); }'
].join('\n');
// The contact grid is a hashed cube of G³ cells (G a power of two), one cell =
// one neighbour radius, wrapping around: far-apart particles may share a cell,
// the distance check sorts them out.
var GLSL_HGRID = [
  'uniform int uGMask;',
  'uniform int uGShift;',
  'uniform int uSXMask;',
  'uniform int uSXShift;',
  'ivec2 hashAt(ivec3 c) { c &= uGMask; return ivec2(((c.z & uSXMask) << uGShift) + c.x, ((c.z >> uSXShift) << uGShift) + c.y); }'
].join('\n');
// the k-th seat of a cell, from the eight slot textures
var GLSL_SLOTS = [
  'float slotAt(int k, ivec2 a) {',
  '  if (k == 0) return texelFetch(uS0, a, 0).r;',
  '  if (k == 1) return texelFetch(uS1, a, 0).r;',
  '  if (k == 2) return texelFetch(uS2, a, 0).r;',
  '  if (k == 3) return texelFetch(uS3, a, 0).r;',
  '  if (k == 4) return texelFetch(uS4, a, 0).r;',
  '  if (k == 5) return texelFetch(uS5, a, 0).r;',
  '  if (k == 6) return texelFetch(uS6, a, 0).r;',
  '  return texelFetch(uS7, a, 0).r;',
  '}'
].join('\n');

// 1. Filling the contact cells, one slot per pass. Every particle draws a
//    one-pixel point at its cell; the depth test keeps the lowest index.
//    Next pass, particles already seated stay away — a depth-peel that stands
//    in for an atomic counter.
var SLOT_VS = [
  '#version 300 es',
  'precision highp float;',
  'precision highp int;',
  'precision highp sampler2D;',
  'uniform sampler2D uPos;',
  'uniform sampler2D uS0;', 'uniform sampler2D uS1;', 'uniform sampler2D uS2;', 'uniform sampler2D uS3;',
  'uniform sampler2D uS4;', 'uniform sampler2D uS5;', 'uniform sampler2D uS6;', 'uniform sampler2D uS7;',
  'uniform ivec2 uSize;',
  'uniform int uK;',
  'uniform float uInvCell;',
  'uniform vec2 uAtlas;',
  'uniform float uInvN;',
  GLSL_HGRID,
  'flat out float vIdx;',
  'void main() {',
  '  int i = gl_VertexID;',
  '  vec3 p = texelFetch(uPos, ivec2(i % uSize.x, i / uSize.x), 0).xyz;',
  '  ivec2 a = hashAt(ivec3(floor(p * uInvCell)));',
  '  float me = float(i);',
  '  bool t = false;',
  '  if (uK > 0) t = t || (texelFetch(uS0, a, 0).r == me);',
  '  if (uK > 1) t = t || (texelFetch(uS1, a, 0).r == me);',
  '  if (uK > 2) t = t || (texelFetch(uS2, a, 0).r == me);',
  '  if (uK > 3) t = t || (texelFetch(uS3, a, 0).r == me);',
  '  if (uK > 4) t = t || (texelFetch(uS4, a, 0).r == me);',
  '  if (uK > 5) t = t || (texelFetch(uS5, a, 0).r == me);',
  '  if (uK > 6) t = t || (texelFetch(uS6, a, 0).r == me);',
  '  if (uK > 7) t = t || (texelFetch(uS7, a, 0).r == me);',
  '  vIdx = me;',
  '  gl_PointSize = 1.0;',
  '  if (t) { gl_Position = vec4(4.0, 4.0, 4.0, 1.0); return; }',
  '  gl_Position = vec4((vec2(a) + 0.5) / uAtlas * 2.0 - 1.0, me * uInvN * 2.0 - 1.0, 1.0);',
  '}'
].join('\n');
var SLOT_FS = [
  '#version 300 es',
  'precision highp float;',
  'flat in float vIdx;',
  'out vec4 o;',
  'void main() { o = vec4(vIdx, 0.0, 0.0, 1.0); }'
].join('\n');

// 2. Mass onto the mesh: each particle is eight points, one per corner of its
//    cell, cloud-in-cell weights, added up by blending. Mass is in particles;
//    xyz carry mass-weighted position so a cell knows its centre of mass.
//    A particle beyond the mesh adds instead, into the scratch texel on the
//    row below the atlas, the pull it has on the mesh (it feels the mesh's
//    monopole; this is the equal and opposite, per unit of mesh mass, from
//    last time's monopole), so the mesh is not pushed around one-sidedly.
var DEP_VS = [
  '#version 300 es',
  'precision highp float;',
  'precision highp int;',
  'precision highp sampler2D;',
  'uniform sampler2D uPos;',
  'uniform sampler2D uMat;',      // r — mass, in Earth-mantle particles
  'uniform sampler2D uMono;',
  'uniform ivec2 uSize;',
  'uniform float uInvH;',
  'uniform float uL;',
  'uniform float uEps2;',
  GLSL_GRID,
  'out vec4 vW;',
  'void main() {',
  '  int i = gl_VertexID >> 3, k = gl_VertexID & 7;',
  '  ivec2 tc = ivec2(i % uSize.x, i / uSize.x);',
  '  vec3 p = texelFetch(uPos, tc, 0).xyz;',
  '  float mr = texelFetch(uMat, tc, 0).r;',
  '  vec3 g = (p + uL) * uInvH - 0.5;',
  '  gl_PointSize = 1.0;',
  '  if (any(lessThan(g, vec3(0.0))) || any(greaterThan(g, vec3(63.0)))) {',
  '    if (k != 0) { gl_Position = vec4(4.0, 4.0, 4.0, 1.0); vW = vec4(0.0); return; }',
  '    vec4 mono = texelFetch(uMono, ivec2(0), 0);',
  '    vec3 r = mono.xyz / max(mono.w, 1e-6) - p;',
  '    float inv = inversesqrt(dot(r, r) + uEps2);',
  '    gl_Position = vec4(0.5 / 512.0 * 2.0 - 1.0, 512.5 / 513.0 * 2.0 - 1.0, 0.0, 1.0);',
  '    vW = vec4(r * (mr * inv * inv * inv), mr);',
  '    return;',
  '  }',
  '  vec3 f = floor(g), t = g - f;',
  '  ivec3 o = ivec3(k & 1, (k >> 1) & 1, k >> 2);',
  '  ivec3 c = ivec3(f) + o;',
  '  vec3 w3 = mix(1.0 - t, t, vec3(o));',
  '  if (any(greaterThan(c, ivec3(63)))) { gl_Position = vec4(4.0, 4.0, 4.0, 1.0); vW = vec4(0.0); return; }',
  '  gl_Position = vec4((vec2(fineAt(c)) + 0.5) / vec2(512.0, 513.0) * 2.0 - 1.0, 0.0, 1.0);',
  '  vW = vec4(p, 1.0) * (w3.x * w3.y * w3.z * mr);',
  '}'
].join('\n');
var DEP_FS = [
  '#version 300 es',
  'precision highp float;',
  'in vec4 vW;',
  'out vec4 o;',
  'void main() { o = vW; }'
].join('\n');

// 3. The coarse mesh: every 4³ block of fine cells summed.
var COARSE_FS = [
  '#version 300 es',
  'precision highp float;',
  'precision highp int;',
  'precision highp sampler2D;',
  'uniform sampler2D uFine;',
  GLSL_GRID,
  'out vec4 o;',
  'void main() {',
  '  ivec2 me = ivec2(gl_FragCoord.xy);',
  '  ivec3 c = ivec3(me.x & 15, me.y & 15, (me.y >> 4) * 4 + (me.x >> 4));',
  '  vec4 s = vec4(0.0);',
  '  for (int z = 0; z < 4; z++) for (int y = 0; y < 4; y++) for (int x = 0; x < 4; x++)',
  '    s += texelFetch(uFine, fineAt(c * 4 + ivec3(x, y, z)), 0);',
  '  o = s;',
  '}'
].join('\n');
// 4. Everything on the mesh as one mass, for particles that have left it.
var MONO_FS = [
  '#version 300 es',
  'precision highp float;',
  'precision highp sampler2D;',
  'uniform sampler2D uCoarse;',
  'out vec4 o;',
  'void main() {',
  '  vec4 s = vec4(0.0);',
  '  for (int y = 0; y < 64; y++) for (int x = 0; x < 64; x++) s += texelFetch(uCoarse, ivec2(x, y), 0);',
  '  o = s;',
  '}'
].join('\n');
// 5. Gravity at every occupied fine cell: the 5³ coarse cells around it are
//    summed fine cell by fine cell (that block is 3.75 R⊕ wide, so the whole
//    planet is in it), the rest of the world as coarse centres of mass. The
//    potential rides in w, for the energy books.
var CELL_FS = [
  '#version 300 es',
  'precision highp float;',
  'precision highp int;',
  'precision highp sampler2D;',
  'uniform sampler2D uFine;',
  'uniform sampler2D uCoarse;',
  'uniform float uH;',
  'uniform float uL;',
  'uniform float uEps2;',
  'uniform float uGm;',
  GLSL_GRID,
  'out vec4 o;',
  'void main() {',
  '  ivec2 me = ivec2(gl_FragCoord.xy);',
  '  if (me.y >= 512) { o = texelFetch(uFine, me, 0); return; }',   // the scratch row: the pull of what is beyond the mesh, carried through
  '  ivec3 c = ivec3(me.x & 63, me.y & 63, (me.y >> 6) * 8 + (me.x >> 6));',
  '  vec4 mc = texelFetch(uFine, me, 0);',
  '  if (mc.w <= 0.0) { o = vec4(0.0); return; }',
  '  vec3 x = mc.xyz / mc.w;',      // at the cell's centre of mass, not its centre: cell on cell is then equal and opposite, and the mesh keeps momentum

  '  ivec3 cc = c >> 2;',
  '  vec3 acc = vec3(0.0);',
  '  float pot = 0.0;',
  '  for (int kz = 0; kz < 16; kz++) for (int ky = 0; ky < 16; ky++) for (int kx = 0; kx < 16; kx++) {',
  '    ivec3 k = ivec3(kx, ky, kz);',
  '    ivec3 dd = abs(k - cc);',
  '    if (max(dd.x, max(dd.y, dd.z)) <= 2) {',
  '      for (int fz = 0; fz < 4; fz++) for (int fy = 0; fy < 4; fy++) for (int fx = 0; fx < 4; fx++) {',
  '        ivec3 f = k * 4 + ivec3(fx, fy, fz);',
  '        if (f == c) continue;',
  '        vec4 m = texelFetch(uFine, fineAt(f), 0);',
  '        if (m.w <= 0.0) continue;',
  '        vec3 r = m.xyz / m.w - x;',
  '        float inv = inversesqrt(dot(r, r) + uEps2);',
  '        acc += r * (m.w * inv * inv * inv); pot -= m.w * inv;',
  '      }',
  '    } else {',
  '      vec4 m = texelFetch(uCoarse, coarseAt(k), 0);',
  '      if (m.w > 0.0) { vec3 r = m.xyz / m.w - x; float inv = inversesqrt(dot(r, r)); acc += r * (m.w * inv * inv * inv); pot -= m.w * inv; }',
  '    }',
  '  }',
  '  o = vec4(acc * uGm, pot * uGm);',
  '}'
].join('\n');

// 6. The particles. Contacts from the 27 cells around (a spring-dashpot that
//    keeps the material incompressible and turns impact energy into heat),
//    gravity read off the mesh — or, off the mesh, from its total mass.
//    Symplectic Euler: kick, then drift.
var SIM_FS = [
  '#version 300 es',
  'precision highp float;',
  'precision highp int;',
  'precision highp sampler2D;',
  'uniform sampler2D uPos;',      // xyz — position, w — body (0 target, 1 impactor)
  'uniform sampler2D uVel;',      // xyz — velocity, w — heat
  'uniform sampler2D uForce;',
  'uniform sampler2D uMono;',
  'uniform sampler2D uMat;',      // r — mass, in Earth-mantle particles
  'uniform sampler2D uS0;', 'uniform sampler2D uS1;', 'uniform sampler2D uS2;', 'uniform sampler2D uS3;',
  'uniform sampler2D uS4;', 'uniform sampler2D uS5;', 'uniform sampler2D uS6;', 'uniform sampler2D uS7;',
  'uniform ivec2 uSize;',
  'uniform float uInvCell;',
  'uniform float uCell;',
  'uniform float uInvH;',
  'uniform float uL;',
  'uniform float uDt;',
  'uniform float uGDt;',          // the mesh gravity's time step: the steps it stands for, as one impulse — or 0
  'uniform float uGm;',
  'uniform float uEps2;',
  'uniform float uTouch;',        // contact distance, 2a
  'uniform float uLink2;',        // neighbour radius²
  'uniform float uK;',            // contact spring
  'uniform float uC;',            // contact dashpot
  'uniform float uInvM;',
  'uniform float uDamp;',
  'uniform float uCool;',
  'uniform float uHeatK;',
  'uniform float uSettle;',       // 1 — damp everything (settling)
  'uniform float uKick;',         // 1 — set the bulk velocities this step
  'uniform vec3 uBulk0;',
  'uniform vec3 uBulk1;',
  'uniform vec3 uCen0;',          // the bodies' centres and spin rates, for
  'uniform vec3 uCen1;',          // settling and the kick
  'uniform vec3 uSpin0;',
  'uniform vec3 uSpin1;',
  'uniform sampler2D uQ;',        // r — the energy this particle has dissipated so far
  'uniform sampler2D uPPSlot;',   // r — this particle's seat on the loose list, or -1
  'uniform sampler2D uPPForce;',  // the pairwise correction, by seat
  GLSL_GRID,
  GLSL_HGRID,
  GLSL_SLOTS,
  'layout(location = 0) out vec4 oPos;',
  'layout(location = 1) out vec4 oVel;',
  'layout(location = 2) out vec4 oAux;',   // xyz — gravity felt, w — neighbours
  'layout(location = 3) out vec4 oQ;',
  'void main() {',
  '  ivec2 me = ivec2(gl_FragCoord.xy);',
  '  int myIdx = me.y * uSize.x + me.x;',
  '  vec4 P = texelFetch(uPos, me, 0);',
  '  vec4 V = texelFetch(uVel, me, 0);',
  '  vec3 p = P.xyz, v = V.xyz;',
  '  float body = P.w;',
  '  float ri = texelFetch(uMat, me, 0).r;',
  '  vec3 push = vec3(0.0);',
  '  float heat = 0.0, nb = 0.0, lost = 0.0;',
  '  ivec3 c = ivec3(floor(p * uInvCell));',
  '  vec3 c0 = vec3(c) * uCell;',
  '  for (int dz = -1; dz <= 1; dz++) for (int dy = -1; dy <= 1; dy++) for (int dx = -1; dx <= 1; dx++) {',
  '    vec3 lo = c0 + vec3(float(dx), float(dy), float(dz)) * uCell;',
  '    vec3 q = clamp(p, lo, lo + uCell) - p;',       // nearest point of that cell: too far, skip it
  '    if (dot(q, q) > uLink2) continue;',
  '    ivec2 a = hashAt(c + ivec3(dx, dy, dz));',
  '    for (int k = 0; k < 8; k++) {',
  '      float fj = slotAt(k, a);',
  '      if (fj < 0.0) break;',
  '      int j = int(fj);',
  '      if (j == myIdx) continue;',
  '      ivec2 tj = ivec2(j % uSize.x, j / uSize.x);',
  '      vec3 d = texelFetch(uPos, tj, 0).xyz - p;',
  '      float r2 = dot(d, d);',
  '      if (r2 < uLink2) {',
  '        float r = sqrt(r2);',
  '        vec3 n = d / max(r, 1e-6);',
  '        float ov = uTouch - r;',
  '        if (ov > 0.0) {',
  '          vec3 vo = texelFetch(uVel, tj, 0).xyz;',
  '          float rj = texelFetch(uMat, tj, 0).r;',
  '          float cij = uC * sqrt(2.0 * ri * rj / (ri + rj));',   // the dashpot for this pair's reduced mass
  '          float vn = dot(vo - v, n);',
  '          float fn = max(uK * ov - cij * vn, 0.0), on = step(0.0001, fn);',
  '          push -= n * fn;',
  '          heat += cij * vn * vn * on;',
  '          lost += cij * vn * vn * on + uK * ov * vn * (1.0 - on);',   // the dashpot's work — or, with the no-tension clamp holding, the spring energy that just vanishes

  '        }',
  '        nb += 1.0;',
  '      }',
  '    }',
  '  }',
  '  vec3 grav = vec3(0.0);',
  '  vec3 g = (p + uL) * uInvH - 0.5;',
  '  if (all(greaterThanEqual(g, vec3(0.0))) && all(lessThanEqual(g, vec3(63.0)))) {',
  '    vec3 f = floor(g), t = g - f;',
  '    ivec3 c0 = ivec3(f);',
  '    for (int k = 0; k < 8; k++) {',
  '      ivec3 o = ivec3(k & 1, (k >> 1) & 1, k >> 2);',
  '      vec3 w3 = mix(1.0 - t, t, vec3(o));',
  '      grav += texelFetch(uForce, fineAt(min(c0 + o, ivec3(63))), 0).xyz * (w3.x * w3.y * w3.z);',
  '    }',
  '    grav -= texelFetch(uForce, ivec2(0, 512), 0).xyz * uGm;',   // what is beyond the mesh pulls back
  '  } else {',
  '    vec4 mono = texelFetch(uMono, ivec2(0), 0);',
  '    vec3 r = mono.xyz / max(mono.w, 1e-6) - p;',
  '    float inv = inversesqrt(dot(r, r) + uEps2);',
  '    grav = r * (uGm * mono.w * inv * inv * inv);',
  '  }',
  '  float seat = texelFetch(uPPSlot, me, 0).r;',
  '  if (seat >= 0.0) grav += texelFetch(uPPForce, ivec2(int(seat) & 127, int(seat) >> 7), 0).xyz;',
  '  v += push * (uInvM / ri) * uDt + grav * uGDt;',
  '  float T = V.w * uCool + heat * uHeatK * uDt / ri;',
  '  vec3 vr = cross(body < 3.5 ? uSpin0 : uSpin1, p - (body < 3.5 ? uCen0 : uCen1));',   // the body's spin at p
  '  if (uSettle > 0.5) v = vr + (v - vr) * uDamp;',                                       // damp everything but that
  '  if (uKick > 0.5) { v = (body < 3.5 ? uBulk0 : uBulk1) + vr; T = 0.0; }',
  '  p += v * uDt;',
  '  oPos = vec4(p, body);',
  '  oVel = vec4(v, T);',
  '  oAux = vec4(grav, nb);',
  '  oQ = vec4(texelFetch(uQ, me, 0).r + lost * uDt, 0.0, 0.0, 0.0);',
  '}'
].join('\n');

// The approach is a two-body problem solved on the CPU; the bodies fly in
// rigid, this pass just carries them — and turns each about its centre.
var RIGID_FS = [
  '#version 300 es',
  'precision highp float;',
  'precision highp sampler2D;',
  'uniform sampler2D uPos;',
  'uniform sampler2D uVel;',
  'uniform sampler2D uAux;',
  'uniform vec3 uBulk0;',
  'uniform vec3 uBulk1;',
  'uniform vec3 uCen0;',          // centres at the start of the step
  'uniform vec3 uCen1;',
  'uniform vec3 uSpin0;',
  'uniform vec3 uSpin1;',
  'uniform mat3 uRot0;',          // this step's turn
  'uniform mat3 uRot1;',
  'uniform float uDt;',
  'uniform sampler2D uQ;',
  'layout(location = 0) out vec4 oPos;',
  'layout(location = 1) out vec4 oVel;',
  'layout(location = 2) out vec4 oAux;',
  'layout(location = 3) out vec4 oQ;',
  'void main() {',
  '  ivec2 me = ivec2(gl_FragCoord.xy);',
  '  vec4 P = texelFetch(uPos, me, 0);',
  '  bool tgt = P.w < 3.5;',
  '  vec3 bulk = tgt ? uBulk0 : uBulk1, cen = tgt ? uCen0 : uCen1;',
  '  vec3 arm = (tgt ? uRot0 : uRot1) * (P.xyz - cen);',
  '  oPos = vec4(cen + arm + bulk * uDt, P.w);',
  '  oVel = vec4(bulk + cross(tgt ? uSpin0 : uSpin1, arm), texelFetch(uVel, me, 0).w);',   // so the readout sees the approach, spin and all

  '  oAux = texelFetch(uAux, me, 0);',
  '  oQ = texelFetch(uQ, me, 0);',
  '}'
].join('\n');

// Read-outs for the books, run only when the analysis runs: the mesh
// potential at the particle (the monopole's, off the mesh), whether it got a
// seat in its contact cell and how many seats that cell has taken, and the
// energy it has dissipated.
var DIAG_FS = [
  '#version 300 es',
  'precision highp float;',
  'precision highp int;',
  'precision highp sampler2D;',
  'uniform sampler2D uPos;',
  'uniform sampler2D uQ;',
  'uniform sampler2D uForce;',
  'uniform sampler2D uMono;',
  'uniform sampler2D uS0;', 'uniform sampler2D uS1;', 'uniform sampler2D uS2;', 'uniform sampler2D uS3;',
  'uniform sampler2D uS4;', 'uniform sampler2D uS5;', 'uniform sampler2D uS6;', 'uniform sampler2D uS7;',
  'uniform ivec2 uSize;',
  'uniform float uInvCell;',
  'uniform float uInvH;',
  'uniform float uL;',
  'uniform float uEps2;',
  'uniform float uGm;',
  'uniform sampler2D uPPSlot;',
  'uniform sampler2D uPPForce;',
  GLSL_GRID,
  GLSL_HGRID,
  GLSL_SLOTS,
  'out vec4 o;',                  // x — potential, y — seated, +2 off the mesh, z — seats taken in its cell, w — dissipated
  'void main() {',
  '  ivec2 me = ivec2(gl_FragCoord.xy);',
  '  int myIdx = me.y * uSize.x + me.x;',
  '  vec3 p = texelFetch(uPos, me, 0).xyz;',
  '  ivec2 a = hashAt(ivec3(floor(p * uInvCell)));',
  '  float seated = 0.0, taken = 0.0;',
  '  for (int k = 0; k < 8; k++) {',
  '    float fj = slotAt(k, a);',
  '    if (fj < 0.0) break;',
  '    taken += 1.0;',
  '    if (int(fj) == myIdx) seated = 1.0;',
  '  }',
  '  float phi = 0.0, off = 0.0;',
  '  vec3 g = (p + uL) * uInvH - 0.5;',
  '  if (all(greaterThanEqual(g, vec3(0.0))) && all(lessThanEqual(g, vec3(63.0)))) {',
  '    vec3 f = floor(g), t = g - f;',
  '    ivec3 c0 = ivec3(f);',
  '    for (int k = 0; k < 8; k++) {',
  '      ivec3 oo = ivec3(k & 1, (k >> 1) & 1, k >> 2);',
  '      vec3 w3 = mix(1.0 - t, t, vec3(oo));',
  '      phi += texelFetch(uForce, fineAt(min(c0 + oo, ivec3(63))), 0).w * (w3.x * w3.y * w3.z);',
  '    }',
  '  } else {',
  '    vec4 mono = texelFetch(uMono, ivec2(0), 0);',
  '    vec3 r = mono.xyz / max(mono.w, 1e-6) - p;',
  '    phi = -uGm * mono.w * inversesqrt(dot(r, r) + uEps2);',
  '    off = 2.0;',
  '  }',
  '  float seat = texelFetch(uPPSlot, me, 0).r;',
  '  if (seat >= 0.0) phi += texelFetch(uPPForce, ivec2(int(seat) & 127, int(seat) >> 7), 0).w;',
  '  o = vec4(phi, seated + off, taken, texelFetch(uQ, me, 0).r);',
  '}'
].join('\n');

// 7. The loose material — everything beyond 1.3 radii of the planet's centre:
//    the tidal arm from its root out, the disk, the escapers — gets the
//    gravity among itself corrected pairwise, P³M-style: what Newton gives a
//    pair less what the mesh already gave it, out to five cells. A moonlet a
//    cell or two across, which the mesh can only smear, then binds as it
//    should; the planet, ten cells across, stays on the mesh. First the list's
//    positions are gathered into a compact texture…
var PPGATHER_FS = [
  '#version 300 es',
  'precision highp float;',
  'precision highp int;',
  'precision highp sampler2D;',
  'uniform sampler2D uPos;',
  'uniform sampler2D uMat;',
  'uniform sampler2D uIndex;',      // r — the particle in this seat, or -1
  'uniform ivec2 uSize;',
  'out vec4 o;',                    // xyz — position, w — mass, or -1 for an empty seat
  'void main() {',
  '  ivec2 me = ivec2(gl_FragCoord.xy);',
  '  float fi = texelFetch(uIndex, me, 0).r;',
  '  if (fi < 0.0) { o = vec4(0.0, 0.0, 0.0, -1.0); return; }',
  '  int i = int(fi);',
  '  ivec2 t = ivec2(i % uSize.x, i / uSize.x);',
  '  o = vec4(texelFetch(uPos, t, 0).xyz, texelFetch(uMat, t, 0).r);',
  '}'
].join('\n');
// …then every seat is summed against the whole list. The mesh's own pair
// force and potential come as tables by distance (see meshPairTable), Newton's
// is softened at the particle radius, and the difference is tapered out at
// the cut-off.
var PPFORCE_FS = [
  '#version 300 es',
  'precision highp float;',
  'precision highp int;',
  'precision highp sampler2D;',
  'uniform sampler2D uList;',
  'uniform int uCount;',
  'uniform float uGm;',
  'uniform float uCut;',
  'uniform float uA2;',             // particle radius²
  'uniform float uTab[64];',        // the mesh's pair force × r², by r/uCut
  'uniform float uPot[64];',        // its pair potential × r
  'out vec4 o;',                    // xyz — acceleration to add, w — potential to add
  'void main() {',
  '  ivec2 me = ivec2(gl_FragCoord.xy);',
  '  int myIdx = me.y * 128 + me.x;',
  '  vec4 P = texelFetch(uList, me, 0);',
  '  if (myIdx >= uCount || P.w < 0.0) { o = vec4(0.0); return; }',
  '  vec3 acc = vec3(0.0);',
  '  float pot = 0.0, cut2 = uCut * uCut, a = sqrt(uA2);',
  '  for (int j = 0; j < uCount; j++) {',
  '    if (j == myIdx) continue;',
  '    vec4 Q = texelFetch(uList, ivec2(j & 127, j >> 7), 0);',
  '    vec3 d = Q.xyz - P.xyz;',
  '    float r2 = dot(d, d);',
  '    if (r2 >= cut2) continue;',
  '    float r = sqrt(r2);',
  '    float x = clamp(r / uCut * 64.0 - 0.5, 0.0, 63.0);',
  '    int k = int(x), k1 = min(k + 1, 63);',
  '    float t = x - float(k);',
  '    float invN = inversesqrt(r2 + uA2);',
  '    float taper = smoothstep(uCut, 0.8 * uCut, r);',
  '    float fn = invN * invN * invN * r - mix(uTab[k], uTab[k1], t) / max(r2, uA2);',
  '    acc += d / max(r, 1e-6) * (Q.w * fn * taper);',
  '    pot += Q.w * (-invN - mix(uPot[k], uPot[k1], t) / max(r, a)) * taper;',
  '  }',
  '  o = vec4(acc * uGm, pot * uGm);',
  '}'
].join('\n');

    posBuf = null; velBuf = null; diagBuf = null;
    var R = sim.matR.slice();
    worker.postMessage({ gen: sim.gen, N: N, m: sim.m, a: sim.a, P: P, V: V, R: R, D: D, k: sim.k, touch: 2 * sim.a, cap: PP_CAP }, [P.buffer, V.buffer, R.buffer, D.buffer]);
  } else {
    applyReport(fof(N, sim.m, sim.a, P, V, sim.matR, D, sim.k, 2 * sim.a, PP_CAP));
  }
}

// ---------- camera ----------
var cam = { yaw: 0.35, pitch: 0.42, dist: 7.5 };
var camTarget = [0, 0, 0], camPos = [0, 0, 0];
var pointers = new Map(), pinch0 = 0, dist0 = 0;
canvas.addEventListener('pointerdown', function (e) {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointers.size === 2) { var p = Array.from(pointers.values()); pinch0 = Math.hypot(p[0][0] - p[1][0], p[0][1] - p[1][1]); dist0 = cam.dist; }
  canvas.classList.add('dragging');
});
canvas.addEventListener('pointermove', function (e) {
  var prev = pointers.get(e.pointerId);
  if (!prev) return;
  var cur = [e.clientX, e.clientY];
  if (pointers.size === 1) {
    cam.yaw -= (cur[0] - prev[0]) * 0.005;
    cam.pitch = Math.max(-1.5, Math.min(1.5, cam.pitch + (cur[1] - prev[1]) * 0.005));
  }
  pointers.set(e.pointerId, cur);
  if (pointers.size === 2 && pinch0 > 0) {
    var p = Array.from(pointers.values());
    var d = Math.hypot(p[0][0] - p[1][0], p[0][1] - p[1][1]);
    cam.dist = Math.max(1.5, Math.min(80, dist0 * pinch0 / Math.max(d, 1)));
  }
});
function endPointer(e) { pointers.delete(e.pointerId); if (pointers.size === 0) canvas.classList.remove('dragging'); }
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', function (e) {
  e.preventDefault();
  cam.dist = Math.max(1.5, Math.min(80, cam.dist * Math.exp(e.deltaY * 0.0012)));
}, { passive: false });

// ---------- drawing ----------
var SUN = (function () { var v = [-0.6, 0.45, 0.6], l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; })();
function render() {
  var w = hdr.w, h = hdr.h;
  var goal = (S.follow && sim) ? sim.com1 : [0, 0, 0];
  for (var i = 0; i < 3; i++) camPos[i] += (goal[i] - camPos[i]) * 0.08;
  var cy = Math.cos(cam.pitch), sy = Math.sin(cam.pitch);
  var eye = [camPos[0] + cam.dist * cy * Math.sin(cam.yaw), camPos[1] + cam.dist * sy, camPos[2] + cam.dist * cy * Math.cos(cam.yaw)];
  var proj = perspective(FOV, w / h, 0.05, 3000), view = lookAt(eye, camPos, [0, 1, 0]);
  var vp = mul(proj, view);
  var px = (h / 2) / Math.tan(FOV / 2);

  var sunEye = [
    view[0] * SUN[0] + view[4] * SUN[1] + view[8] * SUN[2],
    view[1] * SUN[0] + view[5] * SUN[1] + view[9] * SUN[2],
    view[2] * SUN[0] + view[6] * SUN[1] + view[10] * SUN[2]];

  if (sim) {
    // 1. the bodies as sphere impostors: material, heat, depth
    var g = gProg.u;
    gl.bindFramebuffer(gl.FRAMEBUFFER, gbuf.fbo);
    gl.viewport(0, 0, w, h);
    gl.clearColor(0, 0, 0, 0);
    gl.depthMask(true);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LESS);
    gl.disable(gl.BLEND);
    gl.useProgram(gProg.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sim.src.pos);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, sim.src.vel);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, sim.src.aux);
    gl.uniform1i(g.uPos, 0); gl.uniform1i(g.uVel, 1); gl.uniform1i(g.uAux, 2);
    gl.uniform2i(g.uSize, sim.W, sim.H);
    gl.uniformMatrix4fv(g.uView, false, view);
    gl.uniformMatrix4fv(g.uProj, false, proj);
    gl.uniform1f(g.uRad, sim.a);
    gl.uniform1f(g.uPx, px);
    gl.uniform1f(g.uMaxPt, MAX_POINT);
    gl.uniform1f(g.uP22, proj[10]);
    gl.uniform1f(g.uP32, proj[14]);
    gl.uniform3fv(g.uCol0, COL_TARGET);
    gl.uniform3fv(g.uCol1, COL_IMPACTOR);
    gl.drawArrays(gl.POINTS, 0, sim.N);

    // 2. bilateral blur, two particles wide, x then y, twice over
    var rpx = sim.a * px / cam.dist * 2.0;
    var taps = Math.max(1, Math.min(12, Math.round(rpx)));
    var b = blurProg.u;
    gl.disable(gl.DEPTH_TEST);
    gl.useProgram(blurProg.p);
    gl.uniform1i(b.uMat, 0); gl.uniform1i(b.uDep, 1);
    gl.uniform1i(b.uTaps, taps);
    gl.uniform1f(b.uStep, Math.max(1, rpx / taps));
    gl.uniform1f(b.uRange, 4.0 * sim.a);
    gl.uniform2i(b.uRes, w, h);
    var from = gbuf, ping = [blurA, blurB];
    for (var pass = 0; pass < 4; pass++) {
      var to = ping[pass & 1];
      gl.bindFramebuffer(gl.FRAMEBUFFER, to.fbo);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, from.mat);
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, from.dep);
      gl.uniform2i(b.uDir, 1 - (pass & 1), pass & 1);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      from = to;
    }
  }

  // 3. compose: the lit skin, then the stars over it
  gl.bindFramebuffer(gl.FRAMEBUFFER, hdr.fbo);
  gl.viewport(0, 0, w, h);
  gl.clearColor(0, 0, 0, 1);
  gl.depthMask(true);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.disable(gl.BLEND);
  gl.enable(gl.DEPTH_TEST);
  if (sim) {
    var s = shadeProg.u;
    gl.depthFunc(gl.ALWAYS);
    gl.useProgram(shadeProg.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, blurB.mat);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, blurB.dep);
    gl.uniform1i(s.uMat, 0); gl.uniform1i(s.uDep, 1);
    gl.uniform2f(s.uInvP, 1 / proj[0], 1 / proj[5]);
    gl.uniform2f(s.uRes, w, h);
    gl.uniform3fv(s.uSunEye, sunEye);
    gl.uniform1f(s.uGlow, S.glow);
    gl.uniform1f(s.uP22, proj[10]);
    gl.uniform1f(s.uP32, proj[14]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  gl.depthFunc(gl.LESS);
  gl.depthMask(false);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  if (S.stars) {
    gl.useProgram(starProg.p);
    gl.uniformMatrix4fv(starProg.u.uVP, false, vp);
    gl.uniform3fv(starProg.u.uEye, eye);
    gl.uniform1f(starProg.u.uBright, 0.5);
    gl.uniform1f(starProg.u.uPx, Math.max(1, h / 900));
    gl.uniform1f(starProg.u.uT, performance.now() / 1000);
    gl.bindVertexArray(starVao);
    gl.drawArrays(gl.POINTS, 0, STAR_COUNT);
    gl.bindVertexArray(vao);
  }
  gl.disable(gl.BLEND);
  gl.disable(gl.DEPTH_TEST);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, w, h);
  gl.useProgram(toneProg.p);
  var dbg = window.DBG | 0;
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, dbg === 1 ? gbuf.dep : dbg === 2 ? blurA.dep : dbg === 3 ? blurB.dep : hdr.tex);
  gl.uniform1i(toneProg.u.uHdr, 0);
  gl.uniform1f(toneProg.u.uDbg, dbg ? 1 : 0);
  gl.uniform1f(toneProg.u.uExposure, S.exposure);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// ---------- HUD ----------
function fmtMass(x) { return x.toFixed(3) + ' M⊕'; }
function fmtTime(t) {
  var sec = t * T_UNIT, hh = Math.floor(sec / 3600), mm = Math.floor((sec % 3600) / 60);
  return 'T+ ' + hh + 'h ' + (mm < 10 ? '0' : '') + mm + 'm';
}
function fmtCount(n) { return n >= 1e6 ? (n / 1e6).toFixed(n % 1e6 ? 1 : 0) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(n); }
// a spin as the day it makes: f the fraction of breakup, wb the body's
// breakup rate in 1/time-unit; negative is retrograde
function fmtSpin(f, wb) {
  if (Math.abs(f) < 0.005) return 'none';
  var h = 2 * Math.PI / (Math.abs(f) * wb) * T_UNIT / 3600;
  return (f < 0 ? '−' : '') + (h >= 10 ? Math.round(h) : h.toFixed(1)) + ' h';
}
var fpsFrames = 0, fpsT0 = performance.now(), fps = 0;
function hud() {
  var sub = PRESETS[S.preset] ? PRESETS[S.preset].label : 'custom';
  if (!sim) sub += ' · building';
  else if (sim.phase === 'settle') sub += ' · settling ' + Math.round(100 * (1 - sim.settleLeft / sim.settleTotal)) + '%';
  else if (paused) sub += ' · paused';
  else if (sim.phase === 'approach') sub += ' · approach';
  else if (sim.t - sim.impactT < 2.5) sub += ' · impact';
  else sub += ' · aftermath';
  $('hud-sub').textContent = sub;
  $('hud-clock').textContent = sim ? fmtTime(sim.t) : 'T+ 0h 00m';
  $('hud-fps').textContent = sim ? fmtCount(sim.N) + ' bodies · ' + Math.round(sim.vc * V_UNIT) + ' km/s · ' + fps + ' fps' : '';
  var rep = $('hud-report');
  if (report && sim) {
    var pct = function (x) { return Math.round(x * 100) + '%'; };
    var lines = ['<b>largest</b>  ' + fmtMass(report.largest) + ' <i>' + pct(report.largestImp) + ' impactor · ' + pct(report.largestIron) + ' iron' + (report.day < 200 ? ' · day ' + report.day.toFixed(1) + ' h' : '') + '</i>'];
    lines.push('<b>in orbit</b> ' + fmtMass(report.orbit));
    if (report.orbit > 0.0005) lines.push('<b>moon</b> ≈ ' + (report.moon / 0.0123).toFixed(2) + ' M☾ <i>· from that disk, j ' + report.jD.toFixed(2) + ' · Ida–Canup–Stewart</i>');
    lines.push('<b>escaping</b> ' + fmtMass(report.escape));
    if (report.second) lines.push('<b>2nd body</b> ' + fmtMass(report.second.mass) + ' <i>· ' + report.second.dist.toFixed(1) + ' R⊕ · ' + (report.second.bound ? 'bound' : 'unbound') + ' · ' + pct(report.second.imp) + ' impactor · ' + pct(report.second.iron) + ' iron</i>');
    // the books, against the first look: the barycentre's drift, the angular
    // momentum in today's Earth–Moon units and its change, the mechanical
    // energy, the heat, and whether the two add up to what they were
    var ref = sim.ref, E = report.KE + report.PE + report.EL;
    var sgn = function (x, d) { var s = Math.abs(x).toFixed(d); return (parseFloat(s) === 0 ? '' : x < 0 ? '\u2212' : '+') + s; };
    lines.push('<b>momentum</b> drift ' + (report.drift * V_UNIT * 1000).toFixed(1) + ' m/s <i>· L ' + (report.L / L_EM).toFixed(2) + ' L<sub>EM</sub>' + (ref ? ' ' + sgn((report.L - ref.L) / ref.L * 100, 2) + ' %' : '') + '</i>');
    lines.push('<b>energy</b> ' + sgn(E, 3) + ' <i>· heat ' + report.Q.toFixed(3) + (ref ? ' · balance ' + sgn((E + report.Q - ref.EQ) / Math.abs(ref.E) * 100, 2) + ' %' : '') + '</i>');
    lines.push('<b>cells</b> ' + (report.unseated * 100).toFixed(2) + ' % unseated <i>· ' + (report.full * 100).toFixed(1) + ' % in full cells · pairs ' + fmtCount(report.pp.list.length) + (report.pp.loose > report.pp.list.length ? ' of ' + fmtCount(report.pp.loose) : '') + '</i>');
    rep.innerHTML = lines.join('\n');
    rep.hidden = false;
  }
}

// ---------- the loop ----------
var frameNo = 0;
function frame() {
  requestAnimationFrame(frame);
  resize();
  if (sim) {
    if (sim.phase === 'settle') settleSome(Math.max(2, Math.round(65536 / sim.N * 8)));
    else if (!paused) {
      if (sim.phase === 'approach') rigidStep(0.0025 * S.speed);
      else {
        stepAcc += S.speed;
        var guard = 0;
        while (stepAcc >= 1 && guard++ < 32 && sim.phase === 'full') { step(false, false); sim.t += sim.dt; stepAcc -= 1; }
      }
    }
  }
  render();
  if (sim && sim.phase !== 'settle' && (frameNo % 45 === 0 || sim.stepNo - analyzedAt >= 360)) analyze();
  frameNo++;
  fpsFrames++;
  var now = performance.now();
  if (now - fpsT0 > 500) { fps = Math.round(fpsFrames * 1000 / (now - fpsT0)); fpsFrames = 0; fpsT0 = now; }
  hud();
}

// ---------- controls ----------
function setOn(container, attr, value) {
  container.querySelectorAll('button[' + attr + ']').forEach(function (b) { b.classList.toggle('on', b.getAttribute(attr) === String(value)); });
}
function syncSliders() {
  $('set-q').value = S.q; $('val-q').textContent = S.q.toFixed(2) + ' M⊕';
  $('set-angle').value = S.angle; $('val-angle').textContent = S.angle + '°';
  $('set-vfac').value = S.vfac; $('val-vfac').textContent = S.vfac.toFixed(2) + ' v.esc';
  $('set-spin0').value = S.spin0; $('val-spin0').textContent = fmtSpin(S.spin0, 1);
  $('set-spin1').value = S.spin1; $('val-spin1').textContent = fmtSpin(S.spin1, Math.sqrt(S.dens));
  $('set-n').value = S.nIdx; $('val-n').textContent = N_LABELS[S.nIdx];
  $('set-rest').value = S.rest; $('val-rest').textContent = S.rest.toFixed(2);
  $('set-core').value = Math.round(S.core * 100); $('val-core').textContent = Math.round(S.core * 100) + '%';
  $('set-dens').value = S.dens; $('val-dens').textContent = S.dens.toFixed(2) + ' ρ⊕';
  $('set-exp').value = S.exposure; $('val-exp').textContent = S.exposure.toFixed(1);
  $('set-glow').value = S.glow; $('val-glow').textContent = S.glow.toFixed(1);
  $('val-shade').textContent = S.shade ? 'on' : 'off';
  $('val-stars').textContent = S.stars ? 'on' : 'off';
}
$('hud-preset').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-preset]');
  if (!b) return;
  var p = PRESETS[b.getAttribute('data-preset')];
  S.preset = b.getAttribute('data-preset'); S.q = p.q; S.angle = p.angle; S.vfac = p.vfac;
  cam.dist = p.dist;
  setOn($('hud-preset'), 'data-preset', S.preset);
  syncSliders();
  build();
});
$('hud-run').addEventListener('click', function (e) {
  var b = e.target.closest('button');
  if (!b) return;
  if (b.id === 'btn-pause') togglePause();
  else if (b.id === 'btn-restart') build();
  else if (b.id === 'btn-follow') { S.follow = !S.follow; b.classList.toggle('on', S.follow); }
  else if (b.hasAttribute('data-speed')) { S.speed = parseFloat(b.getAttribute('data-speed')); setOn($('hud-run'), 'data-speed', S.speed); }
});
function togglePause() { paused = !paused; $('btn-pause').textContent = paused ? 'resume' : 'pause'; }
$('adv-toggle').addEventListener('click', function () {
  var p = $('adv-panel'); p.hidden = !p.hidden; $('adv-toggle').classList.toggle('on', !p.hidden);
});
function custom() { S.preset = 'custom'; setOn($('hud-preset'), 'data-preset', ''); }
function onRange(id, live, apply, keepPreset) {
  var el = $(id);
  el.addEventListener('input', function () { apply(parseFloat(el.value)); syncSliders(); if (live) live(); });
  if (!live) el.addEventListener('change', function () { if (!keepPreset) custom(); build(); });
}
onRange('set-q', null, function (v) { S.q = v; });
onRange('set-angle', null, function (v) { S.angle = v; });
onRange('set-vfac', null, function (v) { S.vfac = v; });
onRange('set-spin0', null, function (v) { S.spin0 = v; }, true);
onRange('set-spin1', null, function (v) { S.spin1 = v; }, true);
onRange('set-n', null, function (v) { S.nIdx = v | 0; }, true);
onRange('set-rest', null, function (v) { S.rest = v; }, true);
onRange('set-core', null, function (v) { S.core = v / 100; }, true);
onRange('set-dens', null, function (v) { S.dens = v; }, true);
onRange('set-exp', function () {}, function (v) { S.exposure = v; });
onRange('set-glow', function () {}, function (v) { S.glow = v; });
$('set-shade').addEventListener('change', function () { S.shade = $('set-shade').checked; syncSliders(); });
$('set-stars').addEventListener('change', function () { S.stars = $('set-stars').checked; syncSliders(); });
window.addEventListener('keydown', function (e) {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON')) return;
  if (e.code === 'Space') { e.preventDefault(); if (sim && sim.phase !== 'settle') togglePause(); }
  else if (e.code === 'KeyR') build();
  else if (e.code === 'KeyF') { S.follow = !S.follow; $('btn-follow').classList.toggle('on', S.follow); }
});

// for scripted screenshots: run straight to a sim time (in time units) and hold
window.__impact = {
  get sim() { return sim; },
  get report() { return report; },
  set meshEvery(n) { MESH_EVERY = n; },
  // the mesh's own books: the net force and torque its cells exert on each
  // other, which should be nothing — as fractions of the sum of their sizes
  meshCheck: function () {
    passDeposit(); passCoarse(); passCell();
    var F = new Float32Array(512 * 512 * 4), Mm = new Float32Array(512 * 512 * 4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, pm.forceFbo); gl.readPixels(0, 0, 512, 512, gl.RGBA, gl.FLOAT, F);
    gl.bindFramebuffer(gl.FRAMEBUFFER, pm.fineFbo); gl.readPixels(0, 0, 512, 512, gl.RGBA, gl.FLOAT, Mm);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    var fx = 0, fy = 0, fz = 0, af = 0, tx = 0, ty = 0, tz = 0, at = 0, M = 0, cells = 0;
    for (var i = 0; i < 512 * 512; i++) {
      var m = Mm[i * 4 + 3];
      if (m <= 0) continue;
      var w = m * sim.m, cx = Mm[i * 4] / m, cy = Mm[i * 4 + 1] / m, cz = Mm[i * 4 + 2] / m;
      var Fx = w * F[i * 4], Fy = w * F[i * 4 + 1], Fz = w * F[i * 4 + 2], Fm = Math.hypot(Fx, Fy, Fz);
      fx += Fx; fy += Fy; fz += Fz; af += Fm;
      tx += cy * Fz - cz * Fy; ty += cz * Fx - cx * Fz; tz += cx * Fy - cy * Fx; at += Fm * Math.hypot(cx, cy, cz);
      M += w; cells++;
    }
    var f = Math.hypot(fx, fy, fz), t = Math.hypot(tx, ty, tz);
    var sc = new Float32Array(4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, pm.forceFbo); gl.readPixels(0, 512, 1, 1, gl.RGBA, gl.FLOAT, sc);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { cells: cells, mass: M, force: f, forceFrac: f / af, accelMs2: f / M * 7910 / 805, torque: t, torqueFrac: t / at, torqueLEMperUnit: t / L_EM,
             beyond: { mass: sc[3] * sim.m, reactMs2: Math.hypot(sc[0], sc[1], sc[2]) * sim.m * 7910 / 805 } };
  },
  // GPU time per pass, averaged over reps, via timer queries (Chrome desktop)
  profile: function (reps) {
    var ext = gl.getExtension('EXT_disjoint_timer_query_webgl2');
    if (!ext) return Promise.resolve('no timer queries');
    reps = reps || 20;
    var stars = S.stars;
    var items = [
      ['slots', passSlots], ['deposit', passDeposit], ['coarse+mono', passCoarse], ['cell', passCell], ['pp', passPP],
      ['sim', function () { passSim(false, false, 0); }], ['step', function () { step(false, false); }],
      ['render', render],
      ['render, no stars', function () { S.stars = false; render(); S.stars = stars; }]
    ];
    var qs = items.map(function () { return gl.createQuery(); });
    items.forEach(function (it, i) { gl.beginQuery(ext.TIME_ELAPSED_EXT, qs[i]); for (var r = 0; r < reps; r++) it[1](); gl.endQuery(ext.TIME_ELAPSED_EXT); });
    return new Promise(function (resolve) {
      (function poll() {
        if (gl.getParameter(ext.GPU_DISJOINT_EXT)) { resolve('disjoint, retry'); return; }
        if (!qs.every(function (q) { return gl.getQueryParameter(q, gl.QUERY_RESULT_AVAILABLE); })) { setTimeout(poll, 50); return; }
        var out = {};
        qs.forEach(function (q, i) { out[items[i][0]] = +(gl.getQueryParameter(q, gl.QUERY_RESULT) / 1e6 / reps).toFixed(3); });
        resolve(out);
      })();
    });
  },
  runTo: function (t) {
    if (sim.t > t) build();
    while (sim.phase === 'settle') settleSome(64);
    while (sim.phase === 'approach' && sim.t < t) rigidStep(0.01);
    while (sim.phase === 'full' && sim.t < t) { step(false, false); sim.t += sim.dt; if (sim.stepNo - analyzedAt >= 360) analyze(true); }
    analyze(true);
    paused = true; $('btn-pause').textContent = 'resume';
    return sim.t;
  }
};

syncSliders();
resize();
build();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>

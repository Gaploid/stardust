<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A giant impact, simulated: two self-gravitating planets of real mass collide in WebGL — the splash, the debris disk, and the moon that gathers out of it.">
<meta property="og:title" content="Stardust — Impact">
<meta property="og:description" content="Two planets with real mass and gravity collide in your browser.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#x1F4A5;</text></svg>">
<title>Stardust — Impact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Same night as the main page — every color explicit. */
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #04060a;
    overflow: hidden;
  }
  #stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: grab;
  }
  #stage.dragging { cursor: grabbing; }
  .hud {
    position: fixed;
    z-index: 2;
    pointer-events: none;
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
    line-height: 1.7;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #66788c;
    user-select: none;
  }
  .hud strong {
    display: block;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 0.3em;
    color: #c2d4e6;
  }
  .hud button {
    background: none;
    border: none;
    margin: 0;
    -webkit-tap-highlight-color: transparent;
    padding: 0 0 3px;
    font: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    color: #66788c;
    cursor: pointer;
    border-bottom: 1px solid transparent;
  }
  .hud button:hover { color: #9db0c4; }
  .hud button:focus-visible { outline: 1px solid #66788c; outline-offset: 3px; }
  .hud button.on { color: #c2d4e6; border-bottom-color: #c2d4e6; }
  .hud button .ic {
    margin-right: 6px;
    font-size: 12px;
    filter: saturate(0.6) brightness(0.9);
  }
  .hud button.on .ic { filter: none; }
  #hud-title { top: 22px; left: 26px; }
  #hud-corner {
    top: 22px;
    right: 26px;
    z-index: 3;
    pointer-events: auto;
  }
  #hud-back {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 14px;
    color: #c2d4e6;
    text-decoration: none;
    background: rgba(8, 12, 18, 0.7);
    border: 1px solid #2a3644;
    border-radius: 4px;
  }
  #hud-back:hover { border-color: #66788c; color: #ffffff; background: rgba(16, 24, 34, 0.85); }
  #hud-controls {
    top: 96px;
    left: 26px;
    display: flex;
    flex-direction: column;
    gap: 13px;
    pointer-events: auto;
  }
  #hud-preset, #hud-run { display: flex; gap: 6px 16px; flex-wrap: wrap; align-items: baseline; }
  #hud-run .sep { color: #3d4a58; }
  #adv-panel {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding: 12px 14px;
    background: rgba(8, 12, 18, 0.78);
    border: 1px solid #22303e;
    border-radius: 4px;
  }
  #adv-panel[hidden] { display: none; }
  #adv-panel label {
    display: grid;
    grid-template-columns: 96px 120px 64px;
    align-items: center;
    gap: 10px;
    font-size: 10px;
    letter-spacing: 0.1em;
  }
  #adv-panel input[type="range"] {
    width: 120px;
    accent-color: #7f9cbb;
    cursor: pointer;
  }
  #adv-panel input[type="checkbox"] {
    justify-self: start;
    width: 14px;
    height: 14px;
    accent-color: #7f9cbb;
    cursor: pointer;
  }
  #adv-panel span { text-align: right; color: #9db0c4; font-variant-numeric: tabular-nums; }
  #adv-panel .note { margin-top: 4px; font-size: 9px; letter-spacing: 0.08em; color: #3d4a58; text-transform: none; }
  #hud-report {
    bottom: 64px;
    right: 26px;
    padding: 10px 12px;
    background: rgba(8, 12, 18, 0.78);
    border: 1px solid #22303e;
    border-radius: 4px;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: none;
    line-height: 1.6;
    color: #9db0c4;
    white-space: pre;
    font-variant-numeric: tabular-nums;
  }
  #hud-report[hidden] { display: none; }
  #hud-report b { font-weight: 500; color: #c2d4e6; }
  #hud-report i { font-style: normal; color: #566574; }
  #hud-help { bottom: 20px; left: 26px; }
  #hud-stat { bottom: 20px; right: 26px; text-align: right; font-variant-numeric: tabular-nums; }
  #hud-stat strong { font-size: 15px; letter-spacing: 0.2em; }
  #fallback {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px;
    letter-spacing: 0.1em;
    color: #8a97a6;
    background: #04060a;
    text-align: center;
    padding: 24px;
  }
  @media (max-width: 640px) {
    #hud-help { display: none; }
    #hud-title { top: 14px; left: 16px; }
    #hud-corner { top: 14px; right: 16px; }
    #hud-back { padding: 8px 10px; }
    #hud-controls { top: 78px; left: 16px; right: 16px; gap: 10px; }
    .hud { font-size: 12px; }
    .hud button { padding: 5px 0 6px; }
    #hud-preset, #hud-run { gap: 4px 14px; }
    #adv-panel { max-width: calc(100vw - 64px); }
    #adv-panel label { grid-template-columns: 84px 1fr 56px; }
    #adv-panel input[type="range"] { width: 100%; height: 26px; }
    #hud-stat { bottom: 12px; right: 16px; }
    #hud-report { bottom: 58px; right: 16px; }
  }
</style>

<body>
<canvas id="stage"></canvas>
<div class="hud" id="hud-title"><strong>Impact</strong><span id="hud-sub">initializing…</span></div>
<div class="hud" id="hud-corner"><a id="hud-back" href="index.html">← stardust</a></div>
<div class="hud" id="hud-controls">
<div id="hud-preset">
  <button data-preset="theia" class="on"><span class="ic">🌙</span>theia</button>
  <button data-preset="headon"><span class="ic">💥</span>head-on</button>
  <button data-preset="hitrun"><span class="ic">☄️</span>hit &amp; run</button>
  <button data-preset="twins"><span class="ic">🪐</span>twins</button>
  <button data-preset="shatter"><span class="ic">🔥</span>shatter</button>
</div>
<div id="hud-run">
  <button id="btn-pause">pause</button>
  <button id="btn-restart">restart</button>
  <span class="sep">·</span>
  <button data-speed="1">¼×</button>
  <button data-speed="2">½×</button>
  <button data-speed="4" class="on">1×</button>
  <button data-speed="8">2×</button>
  <button data-speed="16">4×</button>
  <span class="sep">·</span>
  <button id="btn-follow">follow</button>
</div>
<div id="hud-adv">
  <button id="adv-toggle"><span class="ic">⚙️</span>advanced</button>
  <div id="adv-panel" hidden>
    <label>impactor <input type="range" id="set-q" min="0.02" max="1" step="0.01" value="0.1"><span id="val-q">0.10 M⊕</span></label>
    <label>angle <input type="range" id="set-angle" min="0" max="85" step="1" value="45"><span id="val-angle">45°</span></label>
    <label>speed <input type="range" id="set-vfac" min="0.8" max="3" step="0.05" value="1.05"><span id="val-vfac">1.05 v.esc</span></label>
    <label>bodies <input type="range" id="set-n" min="0" max="4" step="1" value="3"><span id="val-n">131k</span></label>
    <label>bounce <input type="range" id="set-rest" min="0.05" max="0.9" step="0.05" value="0.3"><span id="val-rest">0.30</span></label>
    <label>dust <input type="range" id="set-dust" min="0" max="4000000" step="250000" value="2000000"><span id="val-dust">2M</span></label>
    <label>exposure <input type="range" id="set-exp" min="0.2" max="4" step="0.1" value="1"><span id="val-exp">1.0</span></label>
    <label>glow <input type="range" id="set-glow" min="0" max="3" step="0.1" value="1"><span id="val-glow">1.0</span></label>
    <label>shading <input type="checkbox" id="set-shade" checked><span id="val-shade">on</span></label>
    <label>stars <input type="checkbox" id="set-stars" checked><span id="val-stars">on</span></label>
    <div class="note">impactor · angle · speed · bodies · bounce restart the run</div>
  </div>
</div>
</div>
<div class="hud" id="hud-report" hidden></div>
<div class="hud" id="hud-help">drag — rotate &nbsp;·&nbsp; wheel — zoom &nbsp;·&nbsp; space — pause &nbsp;·&nbsp; r — restart</div>
<div class="hud" id="hud-stat"><strong id="hud-clock">T+ 0h 00m</strong><span id="hud-fps"></span></div>
<div id="fallback">WebGL 2 is not available in this browser —<br>the simulation cannot run.</div>
<script>
(function () {
'use strict';
var $ = function (id) { return document.getElementById(id); };
var canvas = $('stage');
var gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, preserveDrawingBuffer: false, powerPreference: 'high-performance' });
function fail(msg) { var f = $('fallback'); f.innerHTML = msg; f.style.display = 'flex'; }
if (!gl) { fail('WebGL 2 is not available in this browser —<br>the simulation cannot run.'); return; }
if (!gl.getExtension('EXT_color_buffer_float')) { fail('This GPU cannot render to float textures —<br>the simulation cannot run.'); return; }

// ---------- units ----------
// G = 1, Earth mass = 1, Earth radius = 1. Then the time unit is √(R³/GM) = 805 s
// (13.4 min), the velocity unit is 7.91 km/s, and escape speed off Earth is √2.
// Every body-particle carries the same mass, so a body's mass is a head count
// and — at Earth density — its radius is the cube root of its mass.
var T_UNIT = 805, V_UNIT = 7.91;
var N_CHOICES = [16384, 32768, 65536, 131072, 262144];
var N_LABELS = ['16k', '33k', '65k', '131k', '262k'];
var SLOTS = 8;                              // body-particles a contact cell can hold
var FL = 6.0, FH = 2 * FL / 64;             // gravity mesh: 64³ cells over ±6 R⊕
var PRESETS = {
  theia:   { q: 0.10, angle: 45, vfac: 1.05, dist: 7.5, label: 'theia' },      // the canonical Moon-forming impact
  headon:  { q: 0.10, angle: 0,  vfac: 1.00, dist: 7.5, label: 'head-on' },
  hitrun:  { q: 0.25, angle: 65, vfac: 1.60, dist: 10,  label: 'hit & run' },  // grazing and fast: the impactor survives
  twins:   { q: 1.00, angle: 45, vfac: 1.10, dist: 9,   label: 'twins' },
  shatter: { q: 0.50, angle: 20, vfac: 2.60, dist: 18,  label: 'shatter' }
};
var S = { q: 0.1, angle: 45, vfac: 1.05, nIdx: 3, rest: 0.3, dust: 2000000,
          exposure: 1.0, glow: 1.0, shade: true, stars: true, follow: false, speed: 4, preset: 'theia' };
var COL_TARGET = [0.40, 0.58, 0.90], COL_IMPACTOR = [0.96, 0.55, 0.28];
var FOV = 38 * Math.PI / 180;
var STAR_COUNT = 3000;

// ---------- shaders ----------
var GLSL_HASH = [
  'uint hash(uint x) { x ^= x >> 16u; x *= 0x7feb352du; x ^= x >> 15u; x *= 0x846ca68bu; x ^= x >> 16u; return x; }',
  'float rnd(uint x) { return float(hash(x)) * (1.0 / 4294967296.0); }'
].join('\n');
// molten rock: dark red, orange, then yellow-white
var GLSL_HEAT = [
  'vec3 heat(float t) {',
  '  t = max(t, 0.0);',
  '  float r = smoothstep(0.0, 0.25, t);',
  '  float g = smoothstep(0.15, 0.7, t) * 0.75;',
  '  float b = smoothstep(0.45, 1.3, t) * 0.65;',
  '  return vec3(r, g, b) * min(t * 2.5, 2.2);',
  '}'
].join('\n');

var QUAD_VS = [
  '#version 300 es',
  'void main() {',
  '  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));',
  '  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);',
  '}'
].join('\n');

// ---------- the physics, in six passes a step ----------
// 3-D grids live in 2-D atlases: slices side by side. The gravity mesh is a
// fixed 64³ over ±6 R⊕ (8×8 slices of 64×64), its coarse twin 16³ (4×4 of 16²).
var GLSL_GRID = [
  'ivec2 fineAt(ivec3 c) { return ivec2((c.z & 7) * 64 + c.x, (c.z >> 3) * 64 + c.y); }',
  'ivec2 coarseAt(ivec3 c) { return ivec2((c.z & 3) * 16 + c.x, (c.z >> 2) * 16 + c.y); }'
].join('\n');
// The contact grid is a hashed cube of G³ cells (G a power of two), one cell =
// one neighbour radius, wrapping around: far-apart particles may share a cell,
// the distance check sorts them out.
var GLSL_HGRID = [
  'uniform int uGMask;',
  'uniform int uGShift;',
  'uniform int uSXMask;',
  'uniform int uSXShift;',
  'ivec2 hashAt(ivec3 c) { c &= uGMask; return ivec2(((c.z & uSXMask) << uGShift) + c.x, ((c.z >> uSXShift) << uGShift) + c.y); }'
].join('\n');

// 1. Filling the contact cells, one slot per pass. Every particle draws a
//    one-pixel point at its cell; the depth test keeps the lowest index.
//    Next pass, particles already seated stay away — a depth-peel that stands
//    in for an atomic counter.
var SLOT_VS = [
  '#version 300 es',
  'precision highp float;',
  'precision highp int;',
  'precision highp sampler2D;',
  'uniform sampler2D uPos;',
  'uniform sampler2D uS0;', 'uniform sampler2D uS1;', 'uniform sampler2D uS2;', 'uniform sampler2D uS3;',
  'uniform sampler2D uS4;', 'uniform sampler2D uS5;', 'uniform sampler2D uS6;', 'uniform sampler2D uS7;',
  'uniform ivec2 uSize;',
  'uniform int uK;',
  'uniform float uInvCell;',
  'uniform vec2 uAtlas;',
  'uniform float uInvN;',
  GLSL_HGRID,
  'flat out float vIdx;',
  'void main() {',
  '  int i = gl_VertexID;',
  '  vec3 p = texelFetch(uPos, ivec2(i % uSize.x, i / uSize.x), 0).xyz;',
  '  ivec2 a = hashAt(ivec3(floor(p * uInvCell)));',
  '  float me = float(i);',
  '  bool t = false;',
  '  if (uK > 0) t = t || (texelFetch(uS0, a, 0).r == me);',
  '  if (uK > 1) t = t || (texelFetch(uS1, a, 0).r == me);',
  '  if (uK > 2) t = t || (texelFetch(uS2, a, 0).r == me);',
  '  if (uK > 3) t = t || (texelFetch(uS3, a, 0).r == me);',
  '  if (uK > 4) t = t || (texelFetch(uS4, a, 0).r == me);',
  '  if (uK > 5) t = t || (texelFetch(uS5, a, 0).r == me);',
  '  if (uK > 6) t = t || (texelFetch(uS6, a, 0).r == me);',
  '  if (uK > 7) t = t || (texelFetch(uS7, a, 0).r == me);',
  '  vIdx = me;',
  '  gl_PointSize = 1.0;',
  '  if (t) { gl_Position = vec4(4.0, 4.0, 4.0, 1.0); return; }',
  '  gl_Position = vec4((vec2(a) + 0.5) / uAtlas * 2.0 - 1.0, me * uInvN * 2.0 - 1.0, 1.0);',
  '}'
].join('\n');
var SLOT_FS = [
  '#version 300 es',
  'precision highp float;',
  'flat in float vIdx;',
  'out vec4 o;',
  'void main() { o = vec4(vIdx, 0.0, 0.0, 1.0); }'
].join('\n');

// 2. Mass onto the mesh: each particle is eight points, one per corner of its
//    cell, cloud-in-cell weights, added up by blending. Mass is in particles;
//    xyz carry mass-weighted position so a cell knows its centre of mass.
var DEP_VS = [
  '#version 300 es',
  'precision highp float;',
  'precision highp int;',
  'precision highp sampler2D;',
  'uniform sampler2D uPos;',
  'uniform ivec2 uSize;',
  'uniform float uInvH;',
  'uniform float uL;',
  GLSL_GRID,
  'out vec4 vW;',
  'void main() {',
  '  int i = gl_VertexID >> 3, k = gl_VertexID & 7;',
  '  vec3 p = texelFetch(uPos, ivec2(i % uSize.x, i / uSize.x), 0).xyz;',
  '  vec3 g = (p + uL) * uInvH - 0.5;',
  '  vec3 f = floor(g), t = g - f;',
  '  ivec3 o = ivec3(k & 1, (k >> 1) & 1, k >> 2);',
  '  ivec3 c = ivec3(f) + o;',
  '  vec3 w3 = mix(1.0 - t, t, vec3(o));',
  '  gl_PointSize = 1.0;',
  '  if (any(lessThan(c, ivec3(0))) || any(greaterThan(c, ivec3(63)))) { gl_Position = vec4(4.0, 4.0, 4.0, 1.0); vW = vec4(0.0); return; }',
  '  gl_Position = vec4((vec2(fineAt(c)) + 0.5) / 512.0 * 2.0 - 1.0, 0.0, 1.0);',
  '  vW = vec4(p, 1.0) * (w3.x * w3.y * w3.z);',
  '}'
].join('\n');
var DEP_FS = [
  '#version 300 es',
  'precision highp float;',
  'in vec4 vW;',
  'out vec4 o;',
  'void main() { o = vW; }'
].join('\n');

// 3. The coarse mesh: every 4³ block of fine cells summed.
var COARSE_FS = [
  '#version 300 es',
  'precision highp float;',
  'precision highp int;',
  'precision highp sampler2D;',
  'uniform sampler2D uFine;',
  GLSL_GRID,
  'out vec4 o;',
  'void main() {',
  '  ivec2 me = ivec2(gl_FragCoord.xy);',
  '  ivec3 c = ivec3(me.x & 15, me.y & 15, (me.y >> 4) * 4 + (me.x >> 4));',
  '  vec4 s = vec4(0.0);',
  '  for (int z = 0; z < 4; z++) for (int y = 0; y < 4; y++) for (int x = 0; x < 4; x++)',
  '    s += texelFetch(uFine, fineAt(c * 4 + ivec3(x, y, z)), 0);',
  '  o = s;',
  '}'
].join('\n');
// 4. Everything on the mesh as one mass, for particles that have left it.
var MONO_FS = [
  '#version 300 es',
  'precision highp float;',
  'precision highp sampler2D;',
  'uniform sampler2D uCoarse;',
  'out vec4 o;',
  'void main() {',
  '  vec4 s = vec4(0.0);',
  '  for (int y = 0; y < 64; y++) for (int x = 0; x < 64; x++) s += texelFetch(uCoarse, ivec2(x, y), 0);',
  '  o = s;',
  '}'
].join('\n');
// 5. Gravity at every occupied fine cell: the 3³ coarse cells around it are
//    summed fine cell by fine cell (that block is 2.25 R⊕ wide, so the whole
//    planet is in it), the rest of the world as coarse centres of mass.
var CELL_FS = [
  '#version 300 es',
  'precision highp float;',
  'precision highp int;',
  'precision highp sampler2D;',
  'uniform sampler2D uFine;',
  'uniform sampler2D uCoarse;',
  'uniform float uH;',
  'uniform float uL;',
  'uniform float uEps2;',
  'uniform float uGm;',
  GLSL_GRID,
  'out vec4 o;',
  'void main() {',
  '  ivec2 me = ivec2(gl_FragCoord.xy);',
  '  ivec3 c = ivec3(me.x & 63, me.y & 63, (me.y >> 6) * 8 + (me.x >> 6));',
  '  if (texelFetch(uFine, me, 0).w <= 0.0) { o = vec4(0.0); return; }',
  '  vec3 x = (vec3(c) + 0.5) * uH - uL;',
  '  ivec3 cc = c >> 2;',
  '  vec3 acc = vec3(0.0);',
  '  for (int kz = 0; kz < 16; kz++) for (int ky = 0; ky < 16; ky++) for (int kx = 0; kx < 16; kx++) {',
  '    ivec3 k = ivec3(kx, ky, kz);',
  '    ivec3 dd = abs(k - cc);',
  '    if (max(dd.x, max(dd.y, dd.z)) <= 1) {',
  '      for (int fz = 0; fz < 4; fz++) for (int fy = 0; fy < 4; fy++) for (int fx = 0; fx < 4; fx++) {',
  '        ivec3 f = k * 4 + ivec3(fx, fy, fz);',
  '        if (f == c) continue;',
  '        vec4 m = texelFetch(uFine, fineAt(f), 0);',
  '        if (m.w <= 0.0) continue;',
  '        vec3 r = m.xyz / m.w - x;',
  '        float inv = inversesqrt(dot(r, r) + uEps2);',
  '        acc += r * (m.w * inv * inv * inv);',
  '      }',
  '    } else {',
  '      vec4 m = texelFetch(uCoarse, coarseAt(k), 0);',
  '      if (m.w > 0.0) { vec3 r = m.xyz / m.w - x; float inv = inversesqrt(dot(r, r)); acc += r * (m.w * inv * inv * inv); }',
  '    }',
  '  }',
  '  o = vec4(acc * uGm, 0.0);',
  '}'
].join('\n');

// 6. The particles. Contacts from the 27 cells around (a spring-dashpot that
//    keeps the material incompressible and turns impact energy into heat),
//    gravity read off the mesh — or, off the mesh, from its total mass.
//    Symplectic Euler: kick, then drift.
var SIM_FS = [
  '#version 300 es',
  'precision highp float;',
  'precision highp int;',
  'precision highp sampler2D;',
  'uniform sampler2D uPos;',      // xyz — position, w — body (0 target, 1 impactor)
  'uniform sampler2D uVel;',      // xyz — velocity, w — heat
  'uniform sampler2D uForce;',
  'uniform sampler2D uMono;',
  'uniform sampler2D uS0;', 'uniform sampler2D uS1;', 'uniform sampler2D uS2;', 'uniform sampler2D uS3;',
  'uniform sampler2D uS4;', 'uniform sampler2D uS5;', 'uniform sampler2D uS6;', 'uniform sampler2D uS7;',
  'uniform ivec2 uSize;',
  'uniform float uInvCell;',
  'uniform float uCell;',
  'uniform float uInvH;',
  'uniform float uL;',
  'uniform float uDt;',
  'uniform float uGm;',
  'uniform float uEps2;',
  'uniform float uTouch;',        // contact distance, 2a
  'uniform float uLink2;',        // neighbour radius²
  'uniform float uK;',            // contact spring
  'uniform float uC;',            // contact dashpot
  'uniform float uInvM;',
  'uniform float uDamp;',
  'uniform float uCool;',
  'uniform float uHeatK;',
  'uniform float uSettle;',       // 1 — damp everything (settling)
  'uniform float uKick;',         // 1 — set the bulk velocities this step
  'uniform vec3 uBulk0;',
  'uniform vec3 uBulk1;',
  GLSL_GRID,
  GLSL_HGRID,
  'layout(location = 0) out vec4 oPos;',
  'layout(location = 1) out vec4 oVel;',
  'layout(location = 2) out vec4 oAux;',   // xyz — gravity felt, w — neighbours
  'float slotAt(int k, ivec2 a) {',
  '  if (k == 0) return texelFetch(uS0, a, 0).r;',
  '  if (k == 1) return texelFetch(uS1, a, 0).r;',
  '  if (k == 2) return texelFetch(uS2, a, 0).r;',
  '  if (k == 3) return texelFetch(uS3, a, 0).r;',
  '  if (k == 4) return texelFetch(uS4, a, 0).r;',
  '  if (k == 5) return texelFetch(uS5, a, 0).r;',
  '  if (k == 6) return texelFetch(uS6, a, 0).r;',
  '  return texelFetch(uS7, a, 0).r;',
  '}',
  'void main() {',
  '  ivec2 me = ivec2(gl_FragCoord.xy);',
  '  int myIdx = me.y * uSize.x + me.x;',
  '  vec4 P = texelFetch(uPos, me, 0);',
  '  vec4 V = texelFetch(uVel, me, 0);',
  '  vec3 p = P.xyz, v = V.xyz;',
  '  float body = P.w;',
  '  vec3 push = vec3(0.0);',
  '  float heat = 0.0, nb = 0.0;',
  '  ivec3 c = ivec3(floor(p * uInvCell));',
  '  vec3 c0 = vec3(c) * uCell;',
  '  for (int dz = -1; dz <= 1; dz++) for (int dy = -1; dy <= 1; dy++) for (int dx = -1; dx <= 1; dx++) {',
  '    vec3 lo = c0 + vec3(float(dx), float(dy), float(dz)) * uCell;',
  '    vec3 q = clamp(p, lo, lo + uCell) - p;',       // nearest point of that cell: too far, skip it
  '    if (dot(q, q) > uLink2) continue;',
  '    ivec2 a = hashAt(c + ivec3(dx, dy, dz));',
  '    for (int k = 0; k < 8; k++) {',
  '      float fj = slotAt(k, a);',
  '      if (fj < 0.0) break;',
  '      int j = int(fj);',
  '      if (j == myIdx) continue;',
  '      ivec2 tj = ivec2(j % uSize.x, j / uSize.x);',
  '      vec3 d = texelFetch(uPos, tj, 0).xyz - p;',
  '      float r2 = dot(d, d);',
  '      if (r2 < uLink2) {',
  '        float r = sqrt(r2);',
  '        vec3 n = d / max(r, 1e-6);',
  '        float ov = uTouch - r;',
  '        if (ov > 0.0) {',
  '          vec3 vo = texelFetch(uVel, tj, 0).xyz;',
  '          float vn = dot(vo - v, n);',
  '          float fn = max(uK * ov - uC * vn, 0.0);',
  '          push -= n * fn;',
  '          heat += uC * vn * vn * step(0.0001, fn);',
  '        }',
  '        nb += 1.0;',
  '      }',
  '    }',
  '  }',
  '  vec3 grav = vec3(0.0);',
  '  vec3 g = (p + uL) * uInvH - 0.5;',
  '  if (all(greaterThanEqual(g, vec3(0.0))) && all(lessThanEqual(g, vec3(63.0)))) {',
  '    vec3 f = floor(g), t = g - f;',
  '    ivec3 c0 = ivec3(f);',
  '    for (int k = 0; k < 8; k++) {',
  '      ivec3 o = ivec3(k & 1, (k >> 1) & 1, k >> 2);',
  '      vec3 w3 = mix(1.0 - t, t, vec3(o));',
  '      grav += texelFetch(uForce, fineAt(min(c0 + o, ivec3(63))), 0).xyz * (w3.x * w3.y * w3.z);',
  '    }',
  '  } else {',
  '    vec4 mono = texelFetch(uMono, ivec2(0), 0);',
  '    vec3 r = mono.xyz / max(mono.w, 1e-6) - p;',
  '    float inv = inversesqrt(dot(r, r) + uEps2);',
  '    grav = r * (uGm * mono.w * inv * inv * inv);',
  '  }',
  '  vec3 acc = grav + push * uInvM;',
  '  v += acc * uDt;',
  '  float T = V.w * uCool + heat * uHeatK * uDt;',
  '  if (uSettle > 0.5) v *= uDamp;',
  '  if (uKick > 0.5) { v = (body < 0.5) ? uBulk0 : uBulk1; T = 0.0; }',
  '  p += v * uDt;',
  '  oPos = vec4(p, body);',
  '  oVel = vec4(v, T);',
  '  oAux = vec4(grav, nb);',
  '}'
].join('\n');

// The approach is a two-body problem solved on the CPU; the bodies fly in
// rigid, this pass just carries them.
var RIGID_FS = [
  '#version 300 es',
  'precision highp float;',
  'precision highp sampler2D;',
  'uniform sampler2D uPos;',
  'uniform sampler2D uVel;',
  'uniform sampler2D uAux;',
  'uniform vec3 uBulk0;',
  'uniform vec3 uBulk1;',
  'uniform float uDt;',
  'layout(location = 0) out vec4 oPos;',
  'layout(location = 1) out vec4 oVel;',
  'layout(location = 2) out vec4 oAux;',
  'void main() {',
  '  ivec2 me = ivec2(gl_FragCoord.xy);',
  '  vec4 P = texelFetch(uPos, me, 0);',
  '  oPos = vec4(P.xyz + ((P.w < 0.5) ? uBulk0 : uBulk1) * uDt, P.w);',
  '  oVel = texelFetch(uVel, me, 0);',
  '  oAux = texelFetch(uAux, me, 0);',
  '}'
].join('\n');

// The dust. Every body-particle is shown as a little cloud of points that
// ride along with it — no state of their own, their offsets come from a hash
// of the vertex id. Shading is free: the gravity a particle feels points into
// its body, so its negative is the surface normal, and a particle with a full
// shell of neighbours is buried and goes dark.
var DUST_VS = [
  '#version 300 es',
  'precision highp float;',
  'precision highp int;',
  'precision highp sampler2D;',
  'uniform sampler2D uPos;',
  'uniform sampler2D uVel;',
  'uniform sampler2D uAux;',
  'uniform ivec2 uSize;',
  'uniform int uK;',            // dust points per body-particle
  'uniform mat4 uVP;',
  'uniform vec3 uSun;',
  'uniform float uRad;',        // body-particle radius
  'uniform float uSpread;',     // dust cloud radius, in uRad
  'uniform float uPx;',         // pixels per unit at depth 1
  'uniform float uEnergy;',     // light per point
  'uniform float uGlow;',
  'uniform float uShade;',
  'uniform vec3 uCol0;',
  'uniform vec3 uCol1;',
  'in vec4 aOff;',             // xyz — where in the unit ball around its body-particle
  'out vec3 vCol;',
  GLSL_HEAT,
  'void main() {',
  '  int i = gl_VertexID / uK;',
  '  ivec2 tc = ivec2(i % uSize.x, i / uSize.x);',
  '  vec4 P = texelFetch(uPos, tc, 0);',
  '  vec4 V = texelFetch(uVel, tc, 0);',
  '  vec4 A = texelFetch(uAux, tc, 0);',
  '  vec4 clip = uVP * vec4(P.xyz + aOff.xyz * (uRad * uSpread), 1.0);',
  '  float depth = max(clip.w, 0.05);',
  '  float size = clamp(uPx * uRad * 0.45 / depth, 1.0, 14.0);',
  '  gl_PointSize = size;',
  '  gl_Position = clip;',
  '  vec3 base = (P.w < 0.5) ? uCol0 : uCol1;',
  '  float nb = A.w;',
  '  float buried = smoothstep(6.0, 11.0, nb) * uShade;',
  '  float bright = mix(1.0, 0.5, buried);',
  '  vec3 gdir = -A.xyz / (length(A.xyz) + 1e-6);',
  '  float lit = 0.3 + 0.7 * max(0.0, dot(gdir, uSun));',
  '  lit = mix(1.0, lit, uShade * smoothstep(2.0, 6.0, nb));',
  '  vec3 col = (base * lit + heat(V.w) * uGlow) * bright;',
  '  col *= 1.0 + 2.5 * (1.0 - smoothstep(2.0, 6.0, nb));',   // loose ejecta is vapour and dust — show it
  '  vCol = col * (uEnergy / (size * size));',
  '}'
].join('\n');

var DUST_FS = [
  '#version 300 es',
  'precision mediump float;',
  'in vec3 vCol;',
  'out vec4 o;',
  'void main() {',
  '  vec2 d = gl_PointCoord - 0.5;',
  '  float r2 = dot(d, d);',
  '  if (r2 > 0.25) discard;',
  '  float f = 1.0 - r2 * 4.0;',
  '  o = vec4(vCol * (f * f), 1.0);',
  '}'
].join('\n');

var STAR_VS = [
  '#version 300 es',
  'precision highp float;',
  'precision highp int;',
  'uniform mat4 uVP;',
  'uniform vec3 uEye;',
  'uniform float uBright;',
  'out vec3 vCol;',
  GLSL_HASH,
  'void main() {',
  '  uint s = uint(gl_VertexID) * 4u + 7u;',
  '  float z = rnd(s) * 2.0 - 1.0;',
  '  float ph = rnd(s + 1u) * 6.2831853;',
  '  float q = sqrt(max(1.0 - z * z, 0.0));',
  '  vec3 d = vec3(q * cos(ph), z, q * sin(ph));',
  '  float m = rnd(s + 2u);',
  '  float b = pow(m, 4.0) * 2.0 + 0.04;',
  '  vec3 tint = mix(vec3(0.72, 0.84, 1.0), vec3(1.0, 0.9, 0.74), rnd(s + 3u));',
  '  gl_Position = uVP * vec4(uEye + d * 900.0, 1.0);',
  '  gl_PointSize = 1.0 + 1.5 * step(0.985, m);',
  '  vCol = tint * b * uBright;',
  '}'
].join('\n');

var STAR_FS = [
  '#version 300 es',
  'precision mediump float;',
  'in vec3 vCol;',
  'out vec4 o;',
  'void main() { o = vec4(vCol, 1.0); }'
].join('\n');

// The body, in three screen-space passes — the trick fluid renderers use.
// 1. Every body-particle is a sphere impostor with per-fragment depth; the
//    pass keeps its material colour, its heat, and its view-space depth.
// 2. A bilateral blur one particle wide smooths depth and colour along the
//    surface but never across a silhouette — the balls melt into a skin.
// 3. Normals come from the smoothed depth, and the skin is lit by the sun.
var G_VS = [
  '#version 300 es',
  'precision highp float;',
  'precision highp int;',
  'precision highp sampler2D;',
  'uniform sampler2D uPos;',
  'uniform sampler2D uVel;',
  'uniform sampler2D uAux;',
  'uniform ivec2 uSize;',
  'uniform mat4 uView;',
  'uniform mat4 uProj;',
  'uniform float uRad;',
  'uniform float uPx;',
  'uniform float uMaxPt;',
  'uniform vec3 uCol0;',
  'uniform vec3 uCol1;',
  'out float vZc;',
  'out float vR;',
  'out float vNb;',
  'out vec4 vMat;',        // rgb — material, a — heat
  'void main() {',
  '  ivec2 tc = ivec2(gl_VertexID % uSize.x, gl_VertexID / uSize.x);',
  '  vec4 P = texelFetch(uPos, tc, 0);',
  '  vec4 e = uView * vec4(P.xyz, 1.0);',
  '  vNb = texelFetch(uAux, tc, 0).w;',
  '  vZc = e.z;',
  '  vR = uRad * mix(1.0, 1.25, smoothstep(0.0, 6.0, vNb));',   // packed particles run fat, so the skin has no gaps

  '  gl_Position = uProj * e;',
  '  gl_PointSize = clamp(2.1 * vR * uPx / max(-e.z, 0.05), 1.0, uMaxPt);',
  '}'
].join('\n');

var G_FS = [
  '#version 300 es',
  'precision highp float;',
  'uniform float uP22;',
  'uniform float uP32;',
  'in float vZc;',
  'in float vR;',
  'in float vNb;',
  'in vec4 vMat;',
  'layout(location = 0) out vec4 oMat;',
  'layout(location = 1) out vec4 oDep;',   // r — view depth, g — neighbours
  'void main() {',
  '  vec2 d = gl_PointCoord * 2.0 - 1.0;',
  '  float r2 = dot(d, d);',
  '  if (r2 > 1.0) discard;',
  '  float ze = min(vZc + vR * sqrt(1.0 - r2), -0.05);',
  '  gl_FragDepth = ((uP22 * ze + uP32) / (-ze)) * 0.5 + 0.5;',
  '  oMat = vMat;',
  '  oDep = vec4(-ze, vNb, 0.0, 1.0);',
  '}'
].join('\n');

var BLUR_FS = [
  '#version 300 es',
  'precision highp float;',
  'precision highp sampler2D;',
  'uniform sampler2D uMat;',
  'uniform sampler2D uDep;',
  'uniform ivec2 uDir;',
  'uniform int uTaps;',
  'uniform float uStep;',
  'uniform float uRange;',      // the depth jump that ends a surface
  'uniform ivec2 uRes;',
  'layout(location = 0) out vec4 oMat;',
  'layout(location = 1) out vec4 oDep;',
  'void main() {',
  '  ivec2 me = ivec2(gl_FragCoord.xy);',
  '  vec2 d0 = texelFetch(uDep, me, 0).rg;',
  '  float z0 = d0.r;',
  '  if (z0 <= 0.0) { oMat = vec4(0.0); oDep = vec4(0.0); return; }',
  '  float sig = (float(uTaps) * uStep * 0.5 + 0.5) * max(smoothstep(1.0, 5.0, d0.g), 0.05);',   // loners and small clumps keep their shape
  '  float ws = 0.0, zs = 0.0;',
  '  vec4 ms = vec4(0.0);',
  '  for (int i = -uTaps; i <= uTaps; i++) {',
  '    float x = float(i) * uStep;',
  '    ivec2 c = clamp(me + uDir * int(round(x)), ivec2(0), uRes - 1);',
  '    float z = texelFetch(uDep, c, 0).r;',
  '    if (z <= 0.0) continue;',
  '    float dz = (z - z0) / uRange;',
  '    float w = exp(-x * x / (2.0 * sig * sig) - dz * dz);',
  '    ws += w; zs += w * z; ms += w * texelFetch(uMat, c, 0);',
  '  }',
  '  oDep = vec4(zs / ws, d0.g, 0.0, 1.0);',
  '  oMat = ms / ws;',
  '}'
].join('\n');

var SHADE_FS = [
  '#version 300 es',
  'precision highp float;',
  'precision highp sampler2D;',
  'uniform sampler2D uMat;',
  'uniform sampler2D uDep;',
  'uniform vec2 uInvP;',        // 1/P00, 1/P11
  'uniform vec2 uRes;',
  'uniform vec3 uSunEye;',
  'uniform float uGlow;',
  'uniform float uP22;',
  'uniform float uP32;',
  'out vec4 o;',
  GLSL_HEAT,
  'vec3 posAt(ivec2 c) {',
  '  float z = texelFetch(uDep, c, 0).r;',
  '  vec2 ndc = (vec2(c) + 0.5) / uRes * 2.0 - 1.0;',
  '  return vec3(ndc * uInvP * z, -z);',
  '}',
  'void main() {',
  '  ivec2 me = ivec2(gl_FragCoord.xy);',
  '  float z = texelFetch(uDep, me, 0).r;',
  '  if (z <= 0.0) discard;',
  '  vec3 p = posAt(me);',
  '  vec3 r = posAt(me + ivec2(1, 0)) - p, l = p - posAt(me - ivec2(1, 0));',
  '  vec3 u = posAt(me + ivec2(0, 1)) - p, d = p - posAt(me - ivec2(0, 1));',
  '  vec3 dx = abs(r.z) < abs(l.z) ? r : l;',
  '  vec3 dy = abs(u.z) < abs(d.z) ? u : d;',
  '  vec3 n = normalize(cross(dx, dy));',
  '  if (n.z < 0.0) n = -n;',
  '  vec4 m = texelFetch(uMat, me, 0);',
  '  float lit = 0.12 + 0.88 * max(0.0, dot(n, uSunEye));',
  '  lit *= 0.7 + 0.3 * n.z;',                       // the limb turns away
  '  o = vec4(m.rgb * lit + heat(m.a) * (uGlow * 0.7), 1.0);',
  '  gl_FragDepth = ((uP22 * (-z) + uP32) / z) * 0.5 + 0.5;',
  '}'
].join('\n');

var TONE_FS = [
  '#version 300 es',
  'precision highp float;',
  'uniform sampler2D uHdr;',
  'uniform float uExposure;',
  'uniform float uDbg;',
  'out vec4 o;',
  'void main() {',
  '  vec3 c = texelFetch(uHdr, ivec2(gl_FragCoord.xy), 0).rgb;',
  '  if (uDbg > 0.5) { o = vec4(vec3(fract(c.r * 4.0)) * step(0.001, c.r), 1.0); return; }',
  '  c = vec3(1.0) - exp(-c * uExposure);',
  '  c = pow(c, vec3(0.92));',
  '  float n = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453);',
  '  o = vec4(vec3(0.016, 0.024, 0.04) + c + (n - 0.5) / 255.0, 1.0);',
  '}'
].join('\n');

// ---------- GL helpers ----------
function compile(type, src) {
  var sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(sh));
    throw new Error('shader: ' + gl.getShaderInfoLog(sh));
  }
  return sh;
}
function program(vs, fs) {
  var p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('link: ' + gl.getProgramInfoLog(p));
  var u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (var i = 0; i < n; i++) { var info = gl.getActiveUniform(p, i); u[info.name] = gl.getUniformLocation(p, info.name); }
  return { p: p, u: u };
}
function floatTex(w, h, data, internal, type, format) {
  var t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal || gl.RGBA32F, w, h, 0, format || gl.RGBA, type || gl.FLOAT, data || null);
  return t;
}
function simTarget(w, h, pos, vel) {
  var t = { pos: floatTex(w, h, pos), vel: floatTex(w, h, vel), aux: floatTex(w, h, null), fbo: gl.createFramebuffer() };
  gl.bindFramebuffer(gl.FRAMEBUFFER, t.fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t.pos, 0);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, t.vel, 0);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT2, gl.TEXTURE_2D, t.aux, 0);
  gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1, gl.COLOR_ATTACHMENT2]);
  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) throw new Error('sim framebuffer incomplete');
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return t;
}
function freeTarget(t) {
  if (!t) return;
  gl.deleteTexture(t.pos); gl.deleteTexture(t.vel); gl.deleteTexture(t.aux); gl.deleteFramebuffer(t.fbo);
}

var simProg, slotProg, depProg, coarseProg, monoProg, cellProg, rigidProg;
var dustProg, starProg, gProg, blurProg, shadeProg, toneProg, vao;
try {
  simProg = program(QUAD_VS, SIM_FS);
  slotProg = program(SLOT_VS, SLOT_FS);
  depProg = program(DEP_VS, DEP_FS);
  coarseProg = program(QUAD_VS, COARSE_FS);
  monoProg = program(QUAD_VS, MONO_FS);
  cellProg = program(QUAD_VS, CELL_FS);
  rigidProg = program(QUAD_VS, RIGID_FS);
  dustProg = program(DUST_VS, DUST_FS);
  starProg = program(STAR_VS, STAR_FS);
  gProg = program(G_VS, G_FS);
  blurProg = program(QUAD_VS, BLUR_FS);
  shadeProg = program(QUAD_VS, SHADE_FS);
  toneProg = program(QUAD_VS, TONE_FS);
} catch (e) {
  fail('The simulation shaders failed to compile on this GPU.<br>' + String(e.message || e).slice(0, 200));
  return;
}
vao = gl.createVertexArray();
gl.bindVertexArray(vao);   // attribute-less drawing: every vertex is made from gl_VertexID
var dust = { vao: gl.createVertexArray(), buf: gl.createBuffer(), count: -1 };   // the one buffer: dust offsets
var MAX_POINT = gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE)[1];

// ---------- the meshes ----------
function fboFor(tex, depthRb) {
  var f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);

// ---------- who is where: clumps, orbits, escapes ----------
// Friends-of-friends on the CPU every few frames: anything within 2.4 radii
// is the same body. The largest group is "the planet"; everything else is in
// orbit around it or on its way out, by its energy in the planet's frame.
// Self-contained so it can run in a worker: positions and velocities in,
// the report out. Counting sort into hashed cells, then union-find.
function fof(N, m, a, P, V) {
  var L = 2.4 * a, L2 = L * L, inv = 1 / L;

    cx[i] = qx; cy[i] = qy; cz[i] = qz;
    k = ((qx * 73856093) ^ (qy * 19349663) ^ (qz * 83492791)) & TM;
    key[i] = k; cnt[k + 1]++;
  }
  for (k = 0; k < T; k++) cnt[k + 1] += cnt[k];
  var fill = new Int32Array(cnt.subarray(0, T)), order = new Int32Array(N);
  for (i = 0; i < N; i++) order[fill[key[i]]++] = i;
  var uf = new Int32Array(N);
  for (i = 0; i < N; i++) uf[i] = i;
  function find(x) { while (uf[x] !== x) { uf[x] = uf[uf[x]]; x = uf[x]; } return x; }
  for (i = 0; i < N; i++) {
    var px = P[i * 4], py = P[i * 4 + 1], pz = P[i * 4 + 2];
    for (var dz = -1; dz <= 1; dz++) for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
      k = (((cx[i] + dx) * 73856093) ^ ((cy[i] + dy) * 19349663) ^ ((cz[i] + dz) * 83492791)) & TM;
      for (s = cnt[k]; s < cnt[k + 1]; s++) {
        j = order[s];
        if (j <= i) continue;
        var ex = P[j * 4] - px, ey = P[j * 4 + 1] - py, ez = P[j * 4 + 2] - pz;
        if (ex * ex + ey * ey + ez * ez < L2) { var ri = find(i), rj = find(j); if (ri !== rj) uf[ri] = rj; }
      }

  for (i = 0; i < N; i++) size[find(i)]++;
  var g1 = -1, g2 = -1;
  for (i = 0; i < N; i++) if (size[i] > 0) {

    else if (g2 < 0 || size[i] > size[g2]) g2 = i;

  function stats(root) {
    var n = 0, x = 0, y = 0, z = 0, vx = 0, vy = 0, vz = 0, imp = 0;
    for (var t = 0; t < N; t++) if (find(t) === root) {
      n++; x += P[t * 4]; y += P[t * 4 + 1]; z += P[t * 4 + 2];
      vx += V[t * 4]; vy += V[t * 4 + 1]; vz += V[t * 4 + 2];

    }
    return { n: n, mass: n * m, com: [x / n, y / n, z / n], vel: [vx / n, vy / n, vz / n], imp: imp, R: Math.cbrt(n * m) };
  }

  function energy(x, y, z, vx, vy, vz) {
    var r = Math.sqrt((x - A.com[0]) * (x - A.com[0]) + (y - A.com[1]) * (y - A.com[1]) + (z - A.com[2]) * (z - A.com[2]));
    var dv2 = (vx - A.vel[0]) * (vx - A.vel[0]) + (vy - A.vel[1]) * (vy - A.vel[1]) + (vz - A.vel[2]) * (vz - A.vel[2]);
    return 0.5 * dv2 - A.mass / Math.max(r, A.R);
  }
  var orbit = 0, esc = 0;
  for (i = 0; i < N; i++) if (find(i) !== g1) {
    if (energy(P[i * 4], P[i * 4 + 1], P[i * 4 + 2], V[i * 4], V[i * 4 + 1], V[i * 4 + 2]) < 0) orbit++; else esc++;
  }
  var second = null;
  if (B && B.n >= Math.max(8, N / 1000)) {
    var dAB = Math.sqrt((B.com[0] - A.com[0]) * (B.com[0] - A.com[0]) + (B.com[1] - A.com[1]) * (B.com[1] - A.com[1]) + (B.com[2] - A.com[2]) * (B.com[2] - A.com[2]));
    if (dAB > A.R + B.R + 2 * a) second = { mass: B.mass, dist: dAB, bound: energy(B.com[0], B.com[1], B.com[2], B.vel[0], B.vel[1], B.vel[2]) < 0, imp: B.imp / B.n };
  }
  return { largest: A.mass, largestImp: A.imp / A.n, orbit: orbit * m, escape: esc * m, second: second, com: A.com };
}

// the analysis runs in a worker when it can (a quarter million bodies take
// tens of milliseconds); the buffers go back and forth without copying
var worker = null, analyzing = false;

  worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));

// ---------- camera ----------
var cam = { yaw: 0.35, pitch: 0.42, dist: 7.5 };
var camTarget = [0, 0, 0], camPos = [0, 0, 0];
var pointers = new Map(), pinch0 = 0, dist0 = 0;
canvas.addEventListener('pointerdown', function (e) {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointers.size === 2) { var p = Array.from(pointers.values()); pinch0 = Math.hypot(p[0][0] - p[1][0], p[0][1] - p[1][1]); dist0 = cam.dist; }
  canvas.classList.add('dragging');
});
canvas.addEventListener('pointermove', function (e) {
  var prev = pointers.get(e.pointerId);

  if (pointers.size === 1) {
    cam.yaw -= (cur[0] - prev[0]) * 0.005;
    cam.pitch = Math.max(-1.5, Math.min(1.5, cam.pitch + (cur[1] - prev[1]) * 0.005));
  }
  pointers.set(e.pointerId, cur);

    var d = Math.hypot(p[0][0] - p[1][0], p[0][1] - p[1][1]);

function endPointer(e) { pointers.delete(e.pointerId); if (pointers.size === 0) canvas.classList.remove('dragging'); }
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', function (e) {
  e.preventDefault();

}, { passive: false });

// ---------- drawing ----------
var SUN = (function () { var v = [-0.6, 0.45, 0.6], l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; })();
function render() {
  var w = hdr.w, h = hdr.h;
  var goal = (S.follow && sim) ? sim.com1 : [0, 0, 0];
  for (var i = 0; i < 3; i++) camPos[i] += (goal[i] - camPos[i]) * 0.08;
  var cy = Math.cos(cam.pitch), sy = Math.sin(cam.pitch);
  var eye = [camPos[0] + cam.dist * cy * Math.sin(cam.yaw), camPos[1] + cam.dist * sy, camPos[2] + cam.dist * cy * Math.cos(cam.yaw)];

  var sunEye = [
    view[0] * SUN[0] + view[4] * SUN[1] + view[8] * SUN[2],
    view[1] * SUN[0] + view[5] * SUN[1] + view[9] * SUN[2],
    view[2] * SUN[0] + view[6] * SUN[1] + view[10] * SUN[2]];

  if (sim) {
    // 1. the bodies as sphere impostors: material, heat, depth
    var g = gProg.u;
    gl.bindFramebuffer(gl.FRAMEBUFFER, gbuf.fbo);
    gl.viewport(0, 0, w, h);
    gl.clearColor(0, 0, 0, 0);
    gl.depthMask(true);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LESS);
    gl.disable(gl.BLEND);
    gl.useProgram(gProg.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sim.src.pos);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, sim.src.vel);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, sim.src.aux);
    gl.uniform1i(g.uPos, 0); gl.uniform1i(g.uVel, 1); gl.uniform1i(g.uAux, 2);
    gl.uniform2i(g.uSize, sim.W, sim.H);
    gl.uniformMatrix4fv(g.uView, false, view);
    gl.uniformMatrix4fv(g.uProj, false, proj);
    gl.uniform1f(g.uRad, sim.a);
    gl.uniform1f(g.uPx, px);
    gl.uniform1f(g.uMaxPt, MAX_POINT);
    gl.uniform1f(g.uP22, proj[10]);
    gl.uniform1f(g.uP32, proj[14]);
    gl.uniform3fv(g.uCol0, COL_TARGET);
    gl.uniform3fv(g.uCol1, COL_IMPACTOR);
    gl.drawArrays(gl.POINTS, 0, sim.N);

    // 2. bilateral blur, two particles wide, x then y, twice over

    var taps = Math.max(1, Math.min(12, Math.round(rpx)));
    var b = blurProg.u;
    gl.disable(gl.DEPTH_TEST);
    gl.useProgram(blurProg.p);
    gl.uniform1i(b.uMat, 0); gl.uniform1i(b.uDep, 1);
    gl.uniform1i(b.uTaps, taps);
    gl.uniform1f(b.uStep, Math.max(1, rpx / taps));
    gl.uniform1f(b.uRange, 4.0 * sim.a);
    gl.uniform2i(b.uRes, w, h);
    var from = gbuf, ping = [blurA, blurB];
    for (var pass = 0; pass < 4; pass++) {
      var to = ping[pass & 1];
      gl.bindFramebuffer(gl.FRAMEBUFFER, to.fbo);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, from.mat);
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, from.dep);

  gl.viewport(0, 0, w, h);
  gl.clearColor(0, 0, 0, 1);
  gl.depthMask(true);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.disable(gl.BLEND);
  if (sim) {
    var s = shadeProg.u;
    gl.depthFunc(gl.ALWAYS);
    gl.useProgram(shadeProg.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, blurB.mat);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, blurB.dep);
    gl.uniform1i(s.uMat, 0); gl.uniform1i(s.uDep, 1);
    gl.uniform2f(s.uInvP, 1 / proj[0], 1 / proj[5]);
    gl.uniform2f(s.uRes, w, h);
    gl.uniform3fv(s.uSunEye, sunEye);
    gl.uniform1f(s.uGlow, S.glow);
    gl.uniform1f(s.uP22, proj[10]);
    gl.uniform1f(s.uP32, proj[14]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  gl.depthMask(false);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);

    gl.uniform3fv(starProg.u.uEye, eye);
    gl.uniform1f(starProg.u.uBright, 0.9);
    gl.drawArrays(gl.POINTS, 0, STAR_COUNT);

    var u = dustProg.u;
    gl.useProgram(dustProg.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sim.src.pos);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, sim.src.vel);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, sim.src.aux);
    gl.uniform1i(u.uPos, 0); gl.uniform1i(u.uVel, 1); gl.uniform1i(u.uAux, 2);
    gl.uniform2i(u.uSize, sim.W, sim.H);
    gl.uniform1i(u.uK, sim.K);
    gl.uniformMatrix4fv(u.uVP, false, vp);
    gl.uniform3fv(u.uSun, SUN);
    gl.uniform1f(u.uRad, sim.a);

    var energy = 1.8 * (1e6 / (sim.N * sim.K)) * (7.5 / cam.dist) * (7.5 / cam.dist) * (h / 1000) * (h / 1000);
    gl.uniform1f(u.uEnergy, energy);
    gl.uniform1f(u.uGlow, S.glow);
    gl.uniform1f(u.uShade, S.shade ? 1 : 0);
    gl.uniform3fv(u.uCol0, COL_TARGET);
    gl.uniform3fv(u.uCol1, COL_IMPACTOR);

    gl.drawArrays(gl.POINTS, 0, sim.N * sim.K);

  gl.uniform1f(toneProg.u.uDbg, dbg ? 1 : 0);

}

// ---------- HUD ----------
function fmtMass(x) { return x.toFixed(3) + ' M⊕'; }
function fmtTime(t) {
  var sec = t * T_UNIT, hh = Math.floor(sec / 3600), mm = Math.floor((sec % 3600) / 60);

}
function fmtCount(n) { return n >= 1e6 ? (n / 1e6).toFixed(n % 1e6 ? 1 : 0) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(n); }
var fpsFrames = 0, fpsT0 = performance.now(), fps = 0;
function hud() {
  var sub = PRESETS[S.preset] ? PRESETS[S.preset].label : 'custom';
  if (!sim) sub += ' · building';
  else if (sim.phase === 'settle') sub += ' · settling ' + Math.round(100 * (1 - sim.settleLeft / sim.settleTotal)) + '%';
  else if (paused) sub += ' · paused';
  else if (sim.phase === 'approach') sub += ' · approach';
  else if (sim.t - sim.impactT < 2.5) sub += ' · impact';
  else sub += ' · aftermath';
  $('hud-sub').textContent = sub;
  $('hud-clock').textContent = sim ? fmtTime(sim.t) : 'T+ 0h 00m';
  $('hud-fps').textContent = sim ? fmtCount(sim.N) + ' bodies · ' + fmtCount(sim.N * sim.K) + ' dust · ' + Math.round(sim.vc * V_UNIT) + ' km/s · ' + fps + ' fps' : '';
  var rep = $('hud-report');
  if (report && sim) {
    var lines = ['<b>largest</b>  ' + fmtMass(report.largest) + ' <i>' + Math.round(report.largestImp * 100) + '% impactor</i>'];
    lines.push('<b>in orbit</b> ' + fmtMass(report.orbit));
    lines.push('<b>escaping</b> ' + fmtMass(report.escape));
    if (report.second) lines.push('<b>2nd body</b> ' + fmtMass(report.second.mass) + ' <i>· ' + report.second.dist.toFixed(1) + ' R⊕ · ' + (report.second.bound ? 'bound' : 'unbound') + '</i>');
    rep.innerHTML = lines.join('\n');
    rep.hidden = false;
  }
}

// ---------- the loop ----------
var frameNo = 0;
function frame() {
  requestAnimationFrame(frame);
  resize();
  if (sim) {
    if (sim.phase === 'settle') settleSome(Math.max(2, Math.round(65536 / sim.N * 8)));
    else if (!paused) {
      if (sim.phase === 'approach') rigidStep(0.0025 * S.speed);
      else {
        stepAcc += S.speed;
        var guard = 0;
        while (stepAcc >= 1 && guard++ < 32 && sim.phase === 'full') { step(false, false); sim.t += sim.dt; stepAcc -= 1; }
      }
    }
  }
  render();
  if (sim && sim.phase !== 'settle' && frameNo % 45 === 0) analyze();
  frameNo++;
  fpsFrames++;
  var now = performance.now();
  if (now - fpsT0 > 500) { fps = Math.round(fpsFrames * 1000 / (now - fpsT0)); fpsFrames = 0; fpsT0 = now; }
  hud();
}

  var b = e.target.closest('button');
  if (!b) return;
  if (b.id === 'btn-pause') togglePause();
  else if (b.id === 'btn-restart') build();
  else if (b.id === 'btn-follow') { S.follow = !S.follow; b.classList.toggle('on', S.follow); }
  else if (b.hasAttribute('data-speed')) { S.speed = parseFloat(b.getAttribute('data-speed')); setOn($('hud-run'), 'data-speed', S.speed); }
});
function togglePause() { paused = !paused; $('btn-pause').textContent = paused ? 'resume' : 'pause'; }
$('adv-toggle').addEventListener('click', function () {
  var p = $('adv-panel'); p.hidden = !p.hidden; $('adv-toggle').classList.toggle('on', !p.hidden);
});
function custom() { S.preset = 'custom'; setOn($('hud-preset'), 'data-preset', ''); }
function onRange(id, live, apply, keepPreset) {
  var el = $(id);
  el.addEventListener('input', function () { apply(parseFloat(el.value)); syncSliders(); if (live) live(); });
  if (!live) el.addEventListener('change', function () { if (!keepPreset) custom(); build(); });
}
onRange('set-q', null, function (v) { S.q = v; });
onRange('set-angle', null, function (v) { S.angle = v; });
onRange('set-vfac', null, function (v) { S.vfac = v; });
onRange('set-n', null, function (v) { S.nIdx = v | 0; }, true);
onRange('set-rest', null, function (v) { S.rest = v; }, true);
onRange('set-dust', updateDustK, function (v) { S.dust = v; });
onRange('set-exp', function () {}, function (v) { S.exposure = v; });
onRange('set-glow', function () {}, function (v) { S.glow = v; });
$('set-shade').addEventListener('change', function () { S.shade = $('set-shade').checked; syncSliders(); });
$('set-stars').addEventListener('change', function () { S.stars = $('set-stars').checked; syncSliders(); });
window.addEventListener('keydown', function (e) {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON')) return;
  if (e.code === 'Space') { e.preventDefault(); if (sim && sim.phase !== 'settle') togglePause(); }
  else if (e.code === 'KeyR') build();
  else if (e.code === 'KeyF') { S.follow = !S.follow; $('btn-follow').classList.toggle('on', S.follow); }
});

// for scripted screenshots: run straight to a sim time (in time units) and hold
window.__impact = {
  // GPU time per pass, averaged over reps, via timer queries (Chrome desktop)
  profile: function (reps) {
    var ext = gl.getExtension('EXT_disjoint_timer_query_webgl2');
    if (!ext) return Promise.resolve('no timer queries');
    reps = reps || 20;
    var K = sim.K, stars = S.stars;
    var items = [
      ['slots', passSlots], ['deposit', passDeposit], ['coarse+mono', passCoarse], ['cell', passCell],
      ['sim', function () { passSim(false, false); }], ['step', function () { step(false, false); }],
      ['render', render],
      ['render, no dust', function () { sim.K = 0; render(); sim.K = K; }],
      ['render, no dust, no stars', function () { sim.K = 0; S.stars = false; render(); sim.K = K; S.stars = stars; }]
    ];
    var qs = items.map(function () { return gl.createQuery(); });
    items.forEach(function (it, i) { gl.beginQuery(ext.TIME_ELAPSED_EXT, qs[i]); for (var r = 0; r < reps; r++) it[1](); gl.endQuery(ext.TIME_ELAPSED_EXT); });
    return new Promise(function (resolve) {
      (function poll() {
        if (gl.getParameter(ext.GPU_DISJOINT_EXT)) { resolve('disjoint, retry'); return; }
        if (!qs.every(function (q) { return gl.getQueryParameter(q, gl.QUERY_RESULT_AVAILABLE); })) { setTimeout(poll, 50); return; }
        var out = {};
        qs.forEach(function (q, i) { out[items[i][0]] = +(gl.getQueryParameter(q, gl.QUERY_RESULT) / 1e6 / reps).toFixed(3); });
        resolve(out);
      })();
    });
  },
  runTo: function (t) {
    if (sim.t > t) build();
    while (sim.phase === 'settle') settleSome(64);
    while (sim.phase === 'approach' && sim.t < t) rigidStep(0.01);
    while (sim.phase === 'full' && sim.t < t) { step(false, false); sim.t += sim.dt; }
    analyze(true);
    paused = true; $('btn-pause').textContent = 'resume';
    return sim.t;
  }
};

syncSliders();
resize();
build();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>

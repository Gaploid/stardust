<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Up to 2 million WebGL particles assemble into the Sun, Earth, the Moon, a cube, a torus, or a sphere. Water, particle, and fog modes; stir the surface with your cursor. Real NASA and NOAA maps.">
<meta property="og:title" content="Stardust">
<meta property="og:description" content="2M WebGL particles form planets you can stir with your cursor.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#x2728;</text></svg>">
<title>Stardust</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* One deliberate dark world — night water. Every color is explicit. */
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #04060a;
    overflow: hidden;
  }
  #stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: grab;
  }
  #stage.dragging { cursor: grabbing; }
  .hud {
    position: fixed;
    z-index: 2;
    pointer-events: none;
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
    line-height: 1.7;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #66788c;
    user-select: none;
  }
  .hud strong {
    display: block;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 0.3em;
    color: #c2d4e6;
  }
  .hud button {
    background: none;
    border: none;
    margin: 0;
    -webkit-tap-highlight-color: transparent;
    padding: 0 0 3px;
    font: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    color: #66788c;
    cursor: pointer;
    border-bottom: 1px solid transparent;
  }
  .hud button:hover { color: #9db0c4; }
  .hud button:focus-visible { outline: 1px solid #66788c; outline-offset: 3px; }
  .hud button.on { color: #c2d4e6; border-bottom-color: #c2d4e6; }
  #hud-github {
    top: 22px;
    right: 26px;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 14px;
    pointer-events: auto;
    color: #c2d4e6;
    text-decoration: none;
    background: rgba(8, 12, 18, 0.7);
    border: 1px solid #2a3644;
    border-radius: 4px;
  }
  #hud-github:hover { border-color: #66788c; color: #ffffff; background: rgba(16, 24, 34, 0.85); }
  #hud-github svg { display: block; }
  #hud-title  { top: 22px; left: 26px; }
  #hud-controls {
    top: 96px;
    left: 26px;
    display: flex;
    flex-direction: column;
    gap: 13px;
    pointer-events: auto;
  }
  #hud-mode, #hud-shape { display: flex; gap: 6px 16px; flex-wrap: wrap; }
  .hud button .ic {
    margin-right: 6px;
    font-size: 12px;
    filter: saturate(0.6) brightness(0.9);
  }
  .hud button.on .ic { filter: none; }
  #adv-panel {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding: 12px 14px;
    background: rgba(8, 12, 18, 0.78);
    border: 1px solid #22303e;
    border-radius: 4px;
  }
  #adv-panel[hidden] { display: none; }
  #adv-panel label {
    display: grid;
    grid-template-columns: 96px 120px 48px;
    align-items: center;
    gap: 10px;
    font-size: 10px;
    letter-spacing: 0.1em;
  }
  #adv-panel input[type="range"] {
    width: 120px;
    accent-color: #7f9cbb;
    cursor: pointer;
  }
  #adv-panel input[type="checkbox"] {
    justify-self: start;
    width: 14px;
    height: 14px;
    accent-color: #7f9cbb;
    cursor: pointer;
  }
  #adv-panel span { text-align: right; color: #9db0c4; font-variant-numeric: tabular-nums; }
  #hud-help   { bottom: 20px; left: 26px; }
  #hud-stat   { bottom: 20px; right: 26px; text-align: right; font-variant-numeric: tabular-nums; }
  #fallback {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px;
    letter-spacing: 0.1em;
    color: #8a97a6;
    background: #04060a;
    text-align: center;
    padding: 24px;
  }
  @media (max-width: 640px) {
    #hud-help { display: none; }
    #hud-title { top: 14px; left: 16px; }
    #hud-github { top: 14px; right: 16px; padding: 8px 10px; }
    #hud-github span { display: none; }
    #hud-controls { top: 78px; left: 16px; right: 16px; gap: 10px; }
    .hud { font-size: 12px; }
    .hud button { padding: 5px 0 6px; }
    #hud-mode, #hud-shape { gap: 4px 14px; }
    #adv-panel { max-width: calc(100vw - 64px); }
    #adv-panel label { grid-template-columns: 84px 1fr 44px; }
    #adv-panel input[type="range"] { width: 100%; height: 26px; }
    #hud-stat { bottom: 12px; right: 16px; }
  }
</style>
</head>
<body>

<canvas id="stage"></canvas>
<div class="hud" id="hud-title"><strong>Stardust</strong><span id="hud-sub">initializing…</span></div>
<a class="hud" id="hud-github" href="https://github.com/Gaploid/stardust" target="_blank" rel="noopener" aria-label="Stardust on GitHub">
  <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
  <span>github</span>
</a>
<div class="hud" id="hud-controls">
<div id="hud-mode">
  <button data-mode="water" class="on"><span class="ic">💧</span>water</button>
  <button data-mode="particles"><span class="ic">✨</span>particles</button>
  <button data-mode="fog"><span class="ic">🌫️</span>fog</button>
</div>
<div id="hud-shape">
  <button data-shape="earth" class="on"><span class="ic">🌍</span>earth</button>
  <button data-shape="moon"><span class="ic">🌙</span>moon</button>
  <button data-shape="sun"><span class="ic">☀️</span>sun</button>
  <button data-shape="cube"><span class="ic">🧊</span>cube</button>
  <button data-shape="torus"><span class="ic">🍩</span>torus</button>
  <button data-shape="sphere"><span class="ic">⚪</span>sphere</button>
</div>
<div id="hud-adv">
  <button id="adv-toggle"><span class="ic">⚙️</span>advanced</button>
  <div id="adv-panel" hidden>
    <label>particle size <input type="range" id="set-size" min="0.15" max="1.5" step="0.05" value="0.35"><span id="val-size">0.35</span></label>
    <label>hand size <input type="range" id="set-hand" min="0.06" max="1.25" step="0.01" value="0.19"><span id="val-hand">0.19</span></label>
    <label>particles <input type="range" id="set-count" min="20000" max="2000000" step="20000" value="700000"><span id="val-count">700k</span></label>
    <label>focus <input type="range" id="set-fov" min="0" max="100" step="1" value="13"><span id="val-fov">13%</span></label>
    <label>sea floor <input type="checkbox" id="set-floor" checked><span id="val-floor">on</span></label>
  </div>
</div>
</div>
<div class="hud" id="hud-help">hover — touch &nbsp;·&nbsp; drag — rotate &nbsp;·&nbsp; click — scatter &nbsp;·&nbsp; wheel — zoom</div>
<div class="hud" id="hud-stat"><span id="hud-phase">forming</span><br><span id="hud-fps"></span></div>
<div id="fallback">WebGL is not available in this browser —<br>the animation cannot be shown.</div>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('stage');
  var gl = canvas.getContext('webgl', { antialias: false, alpha: false, depth: false, powerPreference: 'high-performance' })
        || canvas.getContext('experimental-webgl');
  if (!gl) {
    document.getElementById('fallback').style.display = 'flex';
    return;
  }

  var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var RIPPLES = 16;   // how many waves live at once

  // advanced settings: particle size, hand size, particle count, focus, sea floor
  var SET = { size: 0.35, hand: 0.19, count: 700000, focus: 0.13, floor: true };
  var fovF = 2.5;     // fixed 30mm-equivalent framing
  var isCoarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  if (isCoarse) SET.count = 300000;   // phone GPUs: start lighter, still adjustable

  // ---------- shaders ----------
  var VSH = [
    'precision highp float;',
    'attribute vec3 aTarget;',
    'attribute vec3 aNormal;',      // surface normal of the shape (lighting, swell, waves)
    'attribute float aShade;',      // per-point brightness of the shape (continents vs oceans)
    'attribute vec4 aTint;',        // rgb — surface color, w — how much it overrides the palette
    'attribute float aExtra;',      // shape extra: >0 — prominence arc param, -1 — corona dust
    'attribute vec3 aScatter;',
    'attribute vec2 aSeed;',        // x: randomness (delay, twinkle, color), y: size
    'uniform mat3 uRot;',
    'uniform mat3 uScatRot;',
    'uniform float uTime;',
    'uniform float uAssemble;',     // 0 = cloud, 1 = assembled shape
    'uniform float uDist;',
    'uniform float uAspect;',
    'uniform float uPxScale;',
    'uniform float uTwinkle;',
    'uniform vec3 uCursorPos;',     // touch point on the near surface (world space)
    'uniform float uRepulse;',      // "hand through fog" strength, decays when idle
    'uniform vec4 uRipples[' + RIPPLES + '];',  // xyz — wave center, w — age (s)
    // mode parameters (particles / water / fog) — JS crossfades them
    'uniform vec3 uPal0;',
    'uniform vec3 uPal1;',
    'uniform vec3 uPal2;',
    'uniform vec3 uPal3;',
    'uniform float uSwellAmp;',     // swell height
    'uniform float uLift;',         // wave lift along the normal
    'uniform float uPush;',         // radial wave push
    'uniform float uRipSpeed;',
    'uniform float uRipWidth;',
    'uniform float uSpread;',       // shell blur (fog)
    'uniform float uSizeMul;',      // point size multiplier
    'uniform vec4 uRipAxis[' + RIPPLES + '];',  // vortex axis at a trail point
    'uniform float uPuff;',         // share of fog "puffs"
    'uniform float uSwirl;',        // cursor vortex strength
    'uniform float uTurb;',         // slow churn in disturbed areas
    'uniform float uDrag;',         // medium dragged along with the cursor',
    'uniform float uSpec;',         // specular highlight (liquid)
    'uniform vec3 uMoveVel;',       // smoothed cursor velocity in world space
    'uniform float uFovF;',         // 1/tan(fov/2) — fixed 30mm-equivalent framing
    'uniform float uHand;',         // touch radius multiplier ("hand size")
    'uniform float uDofPx;',        // depth-of-field strength (max blur circle, px)
    'uniform float uFocusW;',       // view depth of the focal plane (slides through the object)
    'uniform float uSun;',          // 1 when the sun is active: self-luminous boiling plasma
    'uniform float uYOff;',         // vertical NDC shift: keeps the shape clear of the mobile menu
    'varying vec3 vCol;',
    'varying float vSoft;',         // extra per-particle softness from defocus
    'float hash(float n){ return fract(sin(n)*43758.5453123); }',
    'void main(){',
    // ~3% of particles stay as ambient background dust forever
    '  float ambient = step(0.97, aSeed.x);',
    // per-particle delay: particles arrive as a wave, not all at once
    '  float d = aSeed.x * 0.55;',
    '  float t = clamp((uAssemble - d) / (1.0 - d), 0.0, 1.0);',
    '  float e = (t*t*(3.0-2.0*t)) * (1.0 - ambient);',
    '  vec3 scat = uScatRot * aScatter;',
    // mid-flight wobble, strongest halfway
    '  float mid = e*(1.0-e)*4.0;',
    '  float a1 = aSeed.x*6.2831853;',
    '  vec3 wob = vec3(sin(uTime*1.7+a1), cos(uTime*1.3+a1*1.7), sin(uTime*2.1+a1*2.3)) * 0.22 * mid;',
    '  vec3 nm = aNormal;',
    // swell: two slow traveling waves breathe across the surface like water
    '  float swell = sin(aTarget.x*5.0 + aTarget.y*3.0 + uTime*1.1) + 0.8*sin(aTarget.z*4.0 - aTarget.x*2.0 + uTime*0.7);',
    '  float fuzz = fract(aSeed.x*53.17) - 0.5;',
    '  vec3 tgt = aTarget + nm * (uSpread * fuzz + swell * uSwellAmp);',
    // --- the sun is alive ---
    '  float prom = step(0.001, aExtra) * uSun;',            // prominence arcs
    '  float cor = step(aExtra, -0.5) * uSun;',              // streaming corona dust
    // boiling granulation: the whole surface simmers
    '  float boil = sin(aTarget.x*14.0 + uTime*2.1 + a1) * sin(aTarget.y*13.0 - uTime*1.7 + a1*0.7) * sin(aTarget.z*15.0 + uTime*2.4);',
    '  tgt += nm * boil * 0.02 * uSun;',
    // fire flows along the arcs; they sway and breathe
    '  float flow = sin(aExtra*24.0 - uTime*3.5 + a1*4.0);',
    '  tgt += nm * flow * 0.03 * prom;',
    // corona particles endlessly rise off the surface and are reborn
    '  float corT = fract(uTime*0.06 + fract(aSeed.x*7.13));',
    '  tgt += nm * corT * 0.5 * cor;',
    '  vec3 p = uRot * (mix(scat, tgt, e) + wob);',
    '  vec3 n = uRot * nm;',
    // --- cursor interaction ---
    '  vec3 camPos = vec3(0.0, 0.0, uDist);',
    '  float glow = 0.0;',
    '  vec3 disp = vec3(0.0);',
    // touch: a bubble around the near-surface point, not a column through the shape
    '  float hw = uHand * 2.0;',    // 1.0 at the default hand size
    '  vec3 tp = p - uCursorPos;',
    '  float td = length(tp) + 1e-4;',
    '  float fog = exp(-td*td*mix(5.0, 2.5, uPuff)/(uHand*uHand)) * uRepulse;',
    // gentle push; most of the work is done by drag along the motion
    '  disp += (tp / td) * fog * 0.55;',
    '  disp += uMoveVel * fog * uDrag;',
    '  glow += fog * 1.2;',
    // expanding rings along the cursor trail — ripples on water
    '  for (int i = 0; i < ' + RIPPLES + '; i++) {',
    '    vec4 rp = uRipples[i];',
    '    vec3 dv = p - rp.xyz;',
    '    float dd = length(dv) + 1e-4;',
    // waves live on the near surface: anything deeper than their center is untouched
    '    float rMask = 1.0 - smoothstep(0.2, 0.7, rp.z - p.z);',
    // hand size scales the whole stirred sphere: ring width and reach too
    '    float q = (dd - rp.w * uRipSpeed) / (uRipWidth * hw);',
    // distance falloff keeps the wave local; soft fade-in avoids popping
    '    float k = exp(-q*q) * exp(-dd*dd*1.4/(hw*hw)) * exp(-rp.w * 1.8) * (1.0 - exp(-rp.w * 4.0)) * rMask;',
    '    disp += ((dv / dd) * uPush + n * uLift * e) * k;',
    '    glow += k * 0.4;',
    // vortex at the trail point: axis follows the motion, particles roll behind the hand
    '    float kv = exp(-dd*dd*8.0/(uHand*uHand)) * exp(-rp.w*2.2) * (1.0 - exp(-rp.w*3.5)) * rMask;',
    '    disp += cross(uRipAxis[i].xyz, dv / dd) * kv * uSwirl * 0.34;',
    '    glow += kv * uSwirl * 0.16;',
    '  }',
    // slow churn where the medium was disturbed (not a vibration)
    '  vec3 turb = vec3(sin(p.y*6.0 + uTime*1.3 + a1), sin(p.z*5.0 + uTime*1.1 + a1*1.3), sin(p.x*5.5 + uTime*1.5 + a1*0.7));',
    '  disp += turb * min(glow, 1.2) * uTurb * 0.09;',
    '  p += disp;',
    '  float w = uDist - p.z;',
    '  gl_Position = vec4(p.x*uFovF/uAspect, p.y*uFovF + uYOff*w, 0.0, w);',
    // lighting from the assembled shape normal
    '  vec3 L = normalize(vec3(-0.45, 0.65, 0.62));',
    '  float hl = dot(n, L)*0.5 + 0.5;',
    '  float shade = pow(hl, 2.4) * 1.3;',
    '  vec3 V = normalize(camPos - p);',
    '  float rim = pow(1.0 - abs(dot(n, V)), 3.0) * 0.45;',
    '  float lum = mix(0.5, shade + rim, e);',
    // shape relief: continents brighter than oceans
    '  lum *= mix(1.0, aShade, e);',
    // specular highlight — wet gloss; normal slightly perturbed by the swell
    '  vec3 nS = normalize(n + vec3(sin(a1), cos(a1*1.3), sin(a1*2.1)) * 0.18 * swell);',
    '  lum += pow(max(dot(reflect(-L, nS), V), 0.0), 24.0) * uSpec * e * 1.6 * (1.0 - uSun);',
    // the sun is self-luminous: no shadow side, limb darkening on the disc
    // plus a thin glowing chromosphere rim right at the edge, slow breathing
    '  float nv = abs(dot(n, V));',
    '  float limb = 0.5 + 0.5*nv;',
    '  float rimGlow = pow(1.0 - nv, 4.0) * 0.8;',
    '  float ember = (aShade * mix(limb, 1.15, prom + cor) + rimGlow) * (0.95 + 0.25*sin(uTime*0.9 + a1*6.0));',
    '  lum = mix(lum, ember * 1.2, uSun * e);',
    // arcs pulse as fire runs along them; rising corona fades out
    '  lum *= 1.0 + prom * (0.35 + 0.65*max(flow, 0.0));',
    '  lum *= 1.0 - 0.6 * corT * cor;',
    // depth fade: the far side is dimmer (softer for the glowing sun)
    '  float depth = clamp((p.z + 1.6) / 3.2, 0.0, 1.0);',
    '  lum *= mix(0.4 + 0.6*depth, 0.85 + 0.15*depth, uSun);',
    '  lum *= mix(1.0, 0.4, ambient);',
    // glints on swell crests, like a moon path on water
    '  lum *= 1.0 + max(swell, 0.0) * uSwellAmp * 7.5 * e;',
    // disturbed particles light up (kept modest to avoid flicker)
    '  lum = lum * (1.0 + glow) + 0.2*glow;',
    // film-grain twinkle
    '  float tw = mix(1.0, 0.3 + 1.4*hash(aSeed.x*911.7 + floor(uTime*21.0)), uTwinkle);',
    // color from the mode palette; slightly diluted toward white for shimmer
    '  float cs = fract(aSeed.x*13.73);',
    '  vec3 base = cs < 0.5 ? uPal0 : (cs < 0.78 ? uPal1 : (cs < 0.92 ? uPal2 : uPal3));',
    '  vec3 col = mix(base, vec3(1.0), fract(aSeed.x*29.31) * 0.35);',
    // surface color (Earth: green land, blue ocean) blends over the mode palette
    '  col = mix(col, aTint.rgb, aTint.w * e);',
    // in fog ~14% of particles become large soft puffs, the rest are dim dust
    '  float puffSel = step(fract(aSeed.x*7.91), 0.14);',
    '  lum *= mix(1.0, mix(0.8, 0.16, puffSel), uPuff);',
    '  vCol = col * lum * tw;',
    '  float pMul = mix(1.0, mix(0.55, 6.0, puffSel), uPuff);',
    '  float sizePx = clamp(aSeed.y * uPxScale * uSizeMul * pMul / w, 0.6, mix(4.0 * uSizeMul, 64.0, uPuff));',
    '  sizePx *= 1.0 + prom * 0.8 + cor * 0.5;',   // plasma blobs are chunkier
    // depth of field: away from the focal plane points blur into bokeh discs —
    // bigger, softer, dimmer (light spread over a larger area)
    '  float coc = uDofPx * abs(w - uFocusW) / w;',
    '  float blurred = sqrt(sizePx*sizePx + coc*coc);',
    '  vCol *= sizePx*sizePx / (blurred*blurred);',
    '  vSoft = coc / (coc + 3.0);',
    '  gl_PointSize = min(blurred, 72.0);',
    '}'
  ].join('\n');

  var FSH = [
    'precision mediump float;',
    'varying vec3 vCol;',
    'varying float vSoft;',
    'uniform float uAlpha;',
    'uniform float uSoft;',         // 0 — crisp point, 1 — gaussian blob (fog/liquid)
    'void main(){',
    '  vec2 c = gl_PointCoord - 0.5;',
    '  float d2 = dot(c, c);',
    '  if (d2 > 0.25) discard;',
    '  float soft = clamp(uSoft + vSoft, 0.0, 1.0);',
    '  float discShape = smoothstep(0.25, 0.05, d2);',
    '  float gaussShape = exp(-d2*10.0) * smoothstep(0.25, 0.16, d2);',
    '  float a = mix(discShape, gaussShape, soft) * uAlpha;',
    '  gl_FragColor = vec4(vCol * a, a);',   // premultiplied, additive accumulation
    '}'
  ].join('\n');

  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(s));
    }
    return s;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VSH));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FSH));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    document.getElementById('fallback').style.display = 'flex';
    return;
  }
  gl.useProgram(prog);

      cur[key] += (tm[key] - cur[key]) * mk;
    }
    for (var pi = 0; pi < 4; pi++) {
      for (var ci = 0; ci < 3; ci++) {
        cur.pal[pi][ci] += (tm.pal[pi][ci] - cur.pal[pi][ci]) * mk;
      }
    }
    for (var bi = 0; bi < 3; bi++) cur.bg[bi] += (tm.bg[bi] - cur.bg[bi]) * mk;

    // rotation: base spin + drag inertia; a bit faster while forming
    var spin = reducedMotion ? 0.02 : (cur.spin + 0.08 * (phase === PH_ASSEMBLE ? 1 : 0));
    if (!dragging) {
      yaw += yawVel; pitch += pitchVel;
      yawVel *= 0.94; pitchVel *= 0.94;
      pitch = Math.max(-1.25, Math.min(1.25, pitch));
    }
    yaw += spin * dt;

    // the cursor effect smoothly chases the mouse — no jumps from raw events
    var chase = 1 - Math.exp(-9 * dt);
    mouseNdc.x += (mouseTarget.x - mouseNdc.x) * chase;
    mouseNdc.y += (mouseTarget.y - mouseNdc.y) * chase;
    // touch strength is filtered too: rises fast, releases slowly
    repulseTarget *= Math.exp(-2.2 * dt);
    repulse += (repulseTarget - repulse) * (1 - Math.exp(-5 * dt));
    // the touch point is smoothed in world space: the raw projection jumps at the rim
    var wpr = cursorWorldPoint();
    var ck = 1 - Math.exp(-8 * dt);
    cursorSm[0] += (wpr[0] - cursorSm[0]) * ck;
    cursorSm[1] += (wpr[1] - cursorSm[1]) * ck;
    cursorSm[2] += (wpr[2] - cursorSm[2]) * ck;
    // velocity of the smoothed point — the medium is dragged along with the hand
    if (hasMouse && dt > 0.001) {
      var vk = 1 - Math.exp(-6 * dt);
      for (var vi = 0; vi < 3; vi++) {
        velSm[vi] += ((cursorSm[vi] - prevWp[vi]) / dt - velSm[vi]) * vk;
      }
    } else {
      for (var vj = 0; vj < 3; vj++) velSm[vj] *= Math.exp(-4 * dt);
    }
    prevWp[0] = cursorSm[0]; prevWp[1] = cursorSm[1]; prevWp[2] = cursorSm[2];
    var mvx = velSm[0] * 0.1, mvy = velSm[1] * 0.1, mvz = velSm[2] * 0.1;
    var mvl = Math.sqrt(mvx*mvx + mvy*mvy + mvz*mvz);
    if (mvl > 0.45) { var ms = 0.45 / mvl; mvx *= ms; mvy *= ms; mvz *= ms; }
    // wave ages
    for (var k = 0; k < RIPPLES; k++) {
      rippleBuf[k*4 + 3] = rippleTime[k] > 0 ? (now - rippleTime[k]) / 1000 : 1000;
    }

    var t = now / 1000;
    gl.clearColor(cur.bg[0], cur.bg[1], cur.bg[2], 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniformMatrix3fv(U.uRot, false, mat3RotXY(pitch, yaw));
    gl.uniformMatrix3fv(U.uScatRot, false, mat3RotXY(scatSeed.pitch, scatSeed.yaw + t * 0.03));
    gl.uniform1f(U.uTime, t);
    gl.uniform1f(U.uAssemble, assemble);
    gl.uniform1f(U.uDist, dist);
    gl.uniform1f(U.uAspect, aspect);
    gl.uniform1f(U.uPxScale, pxScale);
    gl.uniform1f(U.uTwinkle, reducedMotion ? 0 : cur.twinkle);
    gl.uniform1f(U.uAlpha, cur.alpha);
    gl.uniform3f(U.uPal0, cur.pal[0][0], cur.pal[0][1], cur.pal[0][2]);
    gl.uniform3f(U.uPal1, cur.pal[1][0], cur.pal[1][1], cur.pal[1][2]);
    gl.uniform3f(U.uPal2, cur.pal[2][0], cur.pal[2][1], cur.pal[2][2]);
    gl.uniform3f(U.uPal3, cur.pal[3][0], cur.pal[3][1], cur.pal[3][2]);
    gl.uniform1f(U.uSwellAmp, cur.swell);
    gl.uniform1f(U.uLift, cur.lift);
    gl.uniform1f(U.uPush, cur.push);
    gl.uniform1f(U.uRipSpeed, cur.ripSpeed);
    gl.uniform1f(U.uRipWidth, cur.ripWidth);
    gl.uniform1f(U.uSpread, cur.spread);
    gl.uniform1f(U.uSizeMul, cur.sizeMul);
    gl.uniform1f(U.uSoft, cur.soft);
    gl.uniform1f(U.uPuff, cur.puff);
    gl.uniform1f(U.uSwirl, cur.swirl);
    gl.uniform1f(U.uTurb, cur.turb);
    gl.uniform1f(U.uDrag, cur.drag);
    gl.uniform1f(U.uSpec, cur.spec);
    gl.uniform3f(U.uMoveVel, mvx, mvy, mvz);
    gl.uniform1f(U.uFovF, fovF);
    gl.uniform1f(U.uHand, SET.hand);
    gl.uniform1f(U.uDofPx, pxScale * 2.2);
    gl.uniform1f(U.uFocusW, dist - 1.15 + SET.focus * 2.3);
    sunAmt += ((shape === 'sun' ? 1 : 0) - sunAmt) * (1 - Math.exp(-2.5 * dt));
    gl.uniform1f(U.uSun, sunAmt);
    gl.uniform1f(U.uYOff, yOff);
    gl.uniform3f(U.uCursorPos, cursorSm[0], cursorSm[1], cursorSm[2]);
    gl.uniform1f(U.uRepulse, hasMouse ? repulse : repulse * 0.3);
    gl.uniform4fv(U.uRipples, rippleBuf);
    gl.uniform4fv(U.uRipAxis, rippleAxis);
    gl.drawArrays(gl.POINTS, 0, drawCount);

    // auto quality drop on weak hardware
    frameAcc += dt; frameN++;
    if (frameN >= 40) {
      var avg = frameAcc / frameN;
      fpsShown = Math.round(1 / avg);
      if (!degraded && avg > 0.03 && drawCount > 80000) {
        drawCount = Math.floor(drawCount / 2);
        degraded = true;
        hudSub.textContent = fmt(drawCount) + ' particles · webgl';
      }
      frameAcc = 0; frameN = 0;
    }
    hudTimer += dt;
    if (hudTimer > 0.5) {
      hudTimer = 0;
      hudPhase.textContent = reducedMotion ? 'static' : phaseNames[phase];
      if (fpsShown) hudFps.textContent = fpsShown + ' fps';
    }
  }
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
